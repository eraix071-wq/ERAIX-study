<style>
:root{color-scheme:light;--bg:#E9E7F6;--card:#EEECF9;--in:#E4E1F4;--sh:#CFCBE6;--hi:#fff;--ins:#CFCBE6;--ink:#2A2352;--mute:#7A72A8;--p1:#6C4DF6;--p2:#B14CF0;--bad:#B3264D;--track:#DAD6F0;--glow:rgba(110,80,246,.28);--chipink:#5B5390}
[data-theme=light]{color-scheme:light;--bg:#E9E7F6;--card:#EEECF9;--in:#E4E1F4;--sh:#CFCBE6;--hi:#fff;--ins:#CFCBE6;--ink:#2A2352;--mute:#7A72A8;--p1:#6C4DF6;--p2:#B14CF0;--bad:#B3264D;--track:#DAD6F0;--glow:rgba(110,80,246,.28);--chipink:#5B5390}
[data-theme=dark]{color-scheme:dark;--bg:#16132B;--card:#1E1A3A;--in:#14112A;--sh:#0C0A1B;--hi:#2B2656;--ins:#0A0816;--ink:#ECE9FF;--mute:#A39CD0;--p1:#8E75FF;--p2:#C06BF5;--bad:#FF8FB0;--track:#2E2954;--glow:rgba(110,80,246,.35);--chipink:#CFC8F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 14px 110px}
.raise{background:var(--card);border-radius:18px;box-shadow:6px 6px 14px var(--sh),-6px -6px 14px var(--hi)}
.inset{background:var(--in);border-radius:14px;box-shadow:inset 3px 3px 7px var(--ins),inset -3px -3px 7px var(--hi)}
.grad{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.t{font-size:12.5px;color:var(--mute)}
h2{font-size:20px;font-weight:500;margin:4px 0 2px}
h3{font-size:15px;font-weight:500;margin:0 0 10px}
h4{font-size:14px;font-weight:500;margin:10px 0 4px}
.pad{padding:14px;margin-bottom:14px}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{width:38px;height:38px;border-radius:12px;display:block;flex:none;object-fit:cover}
.brand{font-weight:600;letter-spacing:1.5px;line-height:1.1}
.hd{gap:8px}.hd .ib{width:34px;height:34px}
@media (max-width:359px){.hd .sub{display:none}}
.ib{width:38px;height:38px;border-radius:12px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--p1);padding:0;font-size:18px;flex:none}
.cr{border:0;border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:500;cursor:pointer;width:100%;box-shadow:0 6px 14px var(--glow);background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn.s{background:var(--card);color:var(--p1);box-shadow:4px 4px 10px var(--sh),-4px -4px 10px var(--hi)}
.btn[disabled]{opacity:.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{border:0;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-weight:500}
.tile .t{font-weight:400}
.ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
input,select,textarea{width:100%;border:0;border-radius:14px;padding:12px 14px;background:var(--in);box-shadow:inset 3px 3px 7px var(--ins),inset -3px -3px 7px var(--hi);outline:none;margin-bottom:10px}
textarea{resize:vertical;min-height:84px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;padding:7px 12px;border-radius:12px;font-size:13px;cursor:pointer;background:var(--card);box-shadow:3px 3px 7px var(--sh),-3px -3px 7px var(--hi);color:var(--chipink)}
.chip.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:none}
.bar{height:12px;border-radius:8px;background:var(--in);box-shadow:inset 2px 2px 5px var(--ins),inset -2px -2px 5px var(--hi);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--p1),var(--p2))}

.tour{text-align:center;padding:6px 6px 4px}.tourbig{width:84px;height:84px;margin:6px auto 14px;border-radius:28px;display:grid;place-items:center;font-size:44px;color:#fff;background:linear-gradient(135deg,#E86FC4,#A27BEE 60%,#7C8CF2);box-shadow:0 14px 34px rgba(124,92,255,.4);animation:spop .5s cubic-bezier(.2,1.4,.4,1)}
.tour h2{font-size:23px;margin:0 0 8px}.tour p{color:var(--mute);line-height:1.55;margin:0 8px 16px;font-size:15.5px}
.tdots{display:flex;justify-content:center;gap:6px;margin:0 0 16px}.tdots i{width:7px;height:7px;border-radius:99px;background:rgba(127,127,140,.4);transition:all .25s}.tdots i.on{width:22px;background:#A27BEE}
.tskip{border:0;background:none;color:var(--mute);font:inherit;padding:12px;cursor:pointer}
/* polish */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,.chip,.rowb,.btn,.ib,.tile,.sb,.nv{transition:transform .12s ease,background-color .18s ease,box-shadow .18s ease,opacity .18s ease}
button:active,.chip:active,.rowb:active,.btn:active,.tile:active,.sb:active{transform:scale(.97)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view>*{animation:vin .32s cubic-bezier(.22,1,.36,1) both}#view>*:nth-child(2){animation-delay:.03s}#view>*:nth-child(3){animation-delay:.06s}#view>*:nth-child(4){animation-delay:.09s}
::selection{background:rgba(162,123,238,.35)}
input,textarea,select{transition:border-color .18s,box-shadow .18s}input:focus,textarea:focus,select:focus{outline:none;border-color:#A27BEE;box-shadow:0 0 0 3px rgba(162,123,238,.18)}
.raise,.gl{transition:box-shadow .2s,transform .12s}
.chip{border-radius:99px}
.toast{box-shadow:0 10px 30px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
#offb{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:95;background:#2a2230;color:#fff;font-size:12.5px;padding:7px 14px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;gap:7px;align-items:center;white-space:nowrap}
.herobox{border-radius:26px;background:radial-gradient(120% 90% at 50% 0%,#241f55,#0c0b1f 70%);overflow:hidden;border:1px solid rgba(124,92,255,.35)}
.ohero{display:block;width:100%;height:auto}
.hfloat1{animation:hfl 4.2s ease-in-out infinite}.hfloat2{animation:hfl 5s ease-in-out infinite reverse}
@keyframes hfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hpulse{animation:hpu 3.4s ease-in-out infinite;transform-origin:180px 120px}
@keyframes hpu{0%,100%{opacity:.28;transform:scale(.96)}50%{opacity:.5;transform:scale(1.05)}}
.jetbox{border-radius:22px;background:radial-gradient(120% 120% at 50% 0%,#1d1a45,#0c0b1f 75%);border:1px solid rgba(124,92,255,.3);margin-bottom:12px;overflow:hidden}
.jetsvg{display:block;width:100%;height:auto}
#jtrail{stroke-dashoffset:0}
.jet{offset-path:path('M14 140 C70 150 90 60 150 74 C205 88 190 150 238 112 C268 88 300 56 346 26');offset-rotate:auto;animation:jfly 2.2s cubic-bezier(.45,.05,.3,1) .1s both}
@keyframes jfly{0%{offset-distance:0%;opacity:0;transform:scale(.6)}8%{opacity:1}100%{offset-distance:100%;transform:scale(1)}}
.popc{animation:popc .55s cubic-bezier(.2,1.3,.4,1) both;opacity:0}
@keyframes popc{0%{opacity:0;transform:translateY(26px) scale(.9)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hfloat1,.hfloat2,.hpulse{animation:none}.jet{animation:none;offset-distance:100%}.popc{animation:none;opacity:1}}
#lcam{--bc:#fff}#lcam[data-s=ok]{--bc:#3ddc97}#lcam[data-s=dark],#lcam[data-s=glare]{--bc:#ff8a65}
#lcam .lg{display:none}
#lcam .lf{left:8%;right:8%;top:19%;bottom:36%;border:0!important;box-shadow:none!important;border-radius:0;background:linear-gradient(var(--bc),var(--bc)) 0 0/40px 5px,linear-gradient(var(--bc),var(--bc)) 0 0/5px 40px,linear-gradient(var(--bc),var(--bc)) 100% 0/40px 5px,linear-gradient(var(--bc),var(--bc)) 100% 0/5px 40px,linear-gradient(var(--bc),var(--bc)) 0 100%/40px 5px,linear-gradient(var(--bc),var(--bc)) 0 100%/5px 40px,linear-gradient(var(--bc),var(--bc)) 100% 100%/40px 5px,linear-gradient(var(--bc),var(--bc)) 100% 100%/5px 40px;background-repeat:no-repeat;filter:drop-shadow(0 0 3px rgba(0,0,0,.35))}
#lcam .lt .lr{background:#fff;color:#111;-webkit-backdrop-filter:none;backdrop-filter:none}
#lcam .lb{background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.45) 60%,transparent)}
#lcam .lpills{display:flex;gap:4px;justify-content:center;width:max-content;max-width:100%;margin:0 auto 16px;padding:5px;border-radius:30px;background:rgba(30,30,34,.72)}
#lcam .lp{border:0;background:transparent;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:700;display:flex;gap:7px;align-items:center}
#lcam .lp.on{background:#fff;color:#111}
#lcam .lc.shr{justify-content:center}
#lcam .sh{width:82px;height:82px;border:4px solid #fff;background:transparent}#lcam .sh i{width:62px;height:62px}
</style>

const CK='eraix_cache';
let CACHE={};try{CACHE=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
function saveCache(){let ks=Object.keys(CACHE);const old=(x,y)=>CACHE[x].t-CACHE[y].t;if(ks.length>120){ks.sort(old).slice(0,ks.length-120).forEach(k=>delete CACHE[k])}let str=JSON.stringify(CACHE);ks=Object.keys(CACHE).sort(old);while(str.length>900000&&ks.length>5){delete CACHE[ks.shift()];str=JSON.stringify(CACHE)}try{localStorage.setItem(CK,str)}catch(e){CACHE={}}}
const ckey=(kind,txt)=>kind+'|'+((S.profile||{}).lang||'')+'|'+(S.saver?1:0)+'|'+(S.live?1:0)+'|'+txt.toLowerCase().replace(/\s+/g,' ').trim();
function peek(kind,txt){const h=CACHE[ckey(kind,txt)];return h&&Date.now()-h.t<(kind==='research'?3:30)*864e5?h.v:null}
function store(kind,txt,v){CACHE[ckey(kind,txt)]={t:Date.now(),v};saveCache()}

const BANKX=[{"s":"Mathematics","t":"Number and numeration","d":1,"q":"Convert 110101 (base two) to a number in base ten.","o":["43","51","53","57"],"a":2,"why":"110101 in base two = 32 + 16 + 0 + 4 + 0 + 1 = 53."},{"s":"Mathematics","t":"Logarithms","d":1,"q":"Evaluate log₂ 32 − log₂ 4.","o":["3","8","5","2"],"a":0,"why":"log₂ 32 = 5 and log₂ 4 = 2, so 5 − 2 = 3 (equivalently log₂ (32/4) = log₂ 8 = 3)."},{"s":"Mathematics","t":"Sets and logical reasoning","d":1,"q":"The Venn diagram shows the number of elements in each region. How many elements belong to A or B but not to both?","o":["20","12","24","15"],"a":3,"why":"Elements in exactly one set = A only + B only = 8 + 7 = 15 (the 5 in the overlap is excluded).","dg":{"t":"venn","sets":["A","B"],"reg":{"A":"8","B":"7","AB":"5","out":"4"}}},{"s":"Mathematics","t":"Sets and logical reasoning","d":2,"q":"The Venn diagram shows the number of elements in each region. Find n(A ∪ B ∪ C).","o":["33","23","26","21"],"a":1,"why":"Add every region that lies inside at least one circle: 4 + 5 + 6 + 2 + 3 + 1 + 2 = 23 (do not include the 3 outside).","dg":{"t":"venn","sets":["A","B","C"],"reg":{"A":"4","B":"5","C":"6","AB":"2","AC":"3","BC":"1","ABC":"2","out":"3"}}},{"s":"Mathematics","t":"Sets and logical reasoning","d":2,"q":"Which of the following is the negation of the statement 'All the students passed the test'?","o":["No student passed the test","All the students failed the test","Some students passed the test","Some students did not pass the test"],"a":3,"why":"To deny 'all', it is enough that at least one fails: 'Some students did not pass the test'. 'No student passed' is too strong."},{"s":"Mathematics","t":"Algebra","d":1,"q":"If 3(x − 2) = 2x + 5, find x.","o":["7","11","1","−11"],"a":1,"why":"3x − 6 = 2x + 5, so 3x − 2x = 5 + 6, giving x = 11."},{"s":"Mathematics","t":"Algebra","d":3,"q":"Make x the subject of the formula y = (2x + 1)/(x − 3).","o":["x = (3y + 1)/(y − 2)","x = (3y − 1)/(y − 2)","x = (3y + 1)/(y + 2)","x = (y + 3)/(2 − y)"],"a":0,"why":"y(x − 3) = 2x + 1, so xy − 3y = 2x + 1, so x(y − 2) = 3y + 1, hence x = (3y + 1)/(y − 2)."},{"s":"Mathematics","t":"Geometry","d":1,"q":"In the diagram, triangle PQR has a right angle at Q and ∠R = 35°. Find x.","o":["45°","65°","55°","125°"],"a":2,"why":"The angles of a triangle add to 180°, so x = 180° − 90° − 35° = 55°.","dg":{"t":"triangle","v":["P","Q","R"],"sides":["","",""],"angles":["x","","35°"],"right":1}},{"s":"Mathematics","t":"Geometry","d":2,"q":"In the diagram, PQ = PR and ∠QPR = 40°. Find ∠PQR.","o":["40°","70°","80°","140°"],"a":1,"why":"Base angles of an isosceles triangle are equal, so ∠PQR = (180° − 40°) ÷ 2 = 70°.","dg":{"t":"triangle","v":["P","Q","R"],"sides":["","",""],"angles":["40°","",""],"shape":"iso"}},{"s":"Mathematics","t":"Geometry","d":2,"q":"In the diagram, O is the centre of the circle and the angle between the two radii is 80°. What angle does the same arc make at a point on the remaining part of the circumference?","o":["80°","160°","100°","40°"],"a":3,"why":"The angle at the centre is twice the angle at the circumference, so the angle at the circumference = 80° ÷ 2 = 40°.","dg":{"t":"circle","r":"","angle":"80°","o":"O"}},{"s":"Mathematics","t":"Geometry","d":2,"q":"In the diagram, T is the point of contact of a tangent to a circle with centre O and radius 5 cm. P is a point on the tangent with OP = 13 cm. Find TP.","o":["8 cm","√194 cm","12 cm","18 cm"],"a":2,"why":"A tangent is perpendicular to the radius at the point of contact, so TP² = OP² − OT² = 169 − 25 = 144 and TP = 12 cm.","dg":{"t":"circle","tangent":"T","o":"O"}},{"s":"Mathematics","t":"Geometry","d":1,"q":"In the diagram, triangle ABC has a right angle at B, AB = 9 cm and BC = 12 cm. Find CA.","o":["15 cm","21 cm","√63 cm","225 cm"],"a":0,"why":"By Pythagoras, CA² = 9² + 12² = 81 + 144 = 225, so CA = 15 cm.","dg":{"t":"triangle","v":["A","B","C"],"sides":["9 cm","12 cm","x"],"angles":["","",""],"right":1}},{"s":"Mathematics","t":"Mensuration","d":1,"q":"The diagram shows a parallelogram with base 12 cm and perpendicular height 5 cm. Find its area.","o":["60 cm²","30 cm²","34 cm²","17 cm²"],"a":0,"why":"Area of a parallelogram = base × perpendicular height = 12 × 5 = 60 cm².","dg":{"t":"rect","kind":"para","w":"12 cm","h":"5 cm"}},{"s":"Mathematics","t":"Mensuration","d":2,"q":"The diagram shows a trapezium with parallel sides 6 cm and 10 cm and height 4 cm. Find its area.","o":["64 cm²","24 cm²","32 cm²","40 cm²"],"a":2,"why":"Area = ½(a + b)h = ½(6 + 10) × 4 = 32 cm².","dg":{"t":"rect","kind":"trap","top":"6 cm","w":"10 cm","h":"4 cm"}},{"s":"Mathematics","t":"Mensuration","d":2,"q":"The diagram shows a sector of a circle of radius 7 cm and angle 90° at the centre. Find its area. [Take π = 22/7]","o":["154 cm²","77 cm²","19.25 cm²","38.5 cm²"],"a":3,"why":"Area = (90/360) × π r² = ¼ × 22/7 × 49 = 38.5 cm².","dg":{"t":"circle","r":"7 cm","angle":"90°","o":"O"}},{"s":"Mathematics","t":"Mensuration","d":2,"q":"The diagram shows a rectangle of width 8 cm and diagonal 10 cm. Find the area of the rectangle.","o":["80 cm²","48 cm²","24 cm²","40 cm²"],"a":1,"why":"Height = √(10² − 8²) = √36 = 6 cm. Area = 8 × 6 = 48 cm².","dg":{"t":"rect","kind":"rect","w":"8 cm","h":"h","diag":"10 cm"}},{"s":"Mathematics","t":"Mensuration","d":1,"q":"The diagram shows a circular plate of diameter 14 cm. Find its circumference. [Take π = 22/7]","o":["22 cm","88 cm","44 cm","154 cm"],"a":2,"why":"Circumference = πd = 22/7 × 14 = 44 cm.","dg":{"t":"circle","d":"14 cm","o":"O"}},{"s":"Mathematics","t":"Quadratic equations","d":1,"q":"Solve x² − 5x + 6 = 0.","o":["x = 2 or x = 3","x = −2 or x = −3","x = 1 or x = 6","x = −1 or x = −6"],"a":0,"why":"x² − 5x + 6 = (x − 2)(x − 3) = 0, so x = 2 or x = 3."},{"s":"Mathematics","t":"Quadratic equations","d":3,"q":"If α and β are the roots of 2x² − 3x − 2 = 0, find α² + β².","o":["9/4","1/4","5","17/4"],"a":3,"why":"α + β = 3/2 and αβ = −1. α² + β² = (α + β)² − 2αβ = 9/4 + d): the integers are −1, 0, 1, 2, 3, which is 5 values.","dg":{"t":"numline","min":-4,"max":5,"marks":[{"v":-2,"label":"","open":true},{"v":3,"label":"","open":false}],"from":-2,"to":3}},{"s":"Mathematics","t":"Coordinate geometry","d":1,"q":"Find the distance between the points (1, 2) and (4, 6).","o":["7","√7","5","25"],"a":2,"why":"d = √[(4 − 1)² + (6 − 2)²] = √(9 + 16) = √25 = 5."},{"s":"Mathematics","t":"Coordinate geometry","d":3,"q":"Find the equation of the line through (2, 3) which is parallel to the line y = 2x + 1.","o":["y = 2x − 1","y = 2x + 1","y = −x/2 + 4","y = x/2 + 2"],"a":0,"why":"Parallel lines have equal gradients, so m = 2. y − 3 = 2(x − 2) gives y = 2x − 1."},{"s":"Mathematics","t":"Trigonometry","d":1,"q":"In the diagram, triangle ABC has a right angle at B, AC = 10 cm and ∠C = 30°. Find AB.","o":["5 cm","5√3 cm","10√3 cm","20 cm"],"a":0,"why":"AB is opposite the 30° angle and AC is the hypotenuse: AB = 10 × sin 30° = 10 × ½ = 5 cm.","dg":{"t":"triangle","v":["A","B","C"],"sides":["x","","10 cm"],"angles":["","","30°"],"right":1}},{"s":"Mathematics","t":"Trigonometry","d":2,"q":"In the diagram, triangle ABC has a right angle at B, AB = 5 cm, BC = 12 cm and CA = 13 cm. Find cos C.","o":["5/13","5/12","12/13","13/12"],"a":2,"why":"cos C = adjacent/hypotenuse = BC/CA = 12/13.","dg":{"t":"triangle","v":["A","B","C"],"sides":["5 cm","12 cm","13 cm"],"angles":["","",""],"right":1}},{"s":"Mathematics","t":"Trigonometry","d":3,"q":"In the diagram, the angle of elevation of the top T of a 20 m tower from a point P on level ground is 30°. Find the distance d from P to the foot B of the tower.","o":["10√3 m","20/√3 m","40 m","20√3 m"],"a":3,"why":"tan 30° = 20/d, so d = 20/tan 30° = 20 ÷ (1/√3) = 20√3 m.","dg":{"t":"triangle","v":["T","B","P"],"sides":["20 m","d",""],"angles":["","","30°"],"right":1}},{"s":"Mathematics","t":"Statistics","d":2,"q":"The bar chart shows the number of students who scored each mark in a short quiz. Find the mean mark.","o":["3","2.9","3.4","2.5"],"a":1,"why":"Total students = 2 + 5 + 8 + 3 + 2 = 20. Total marks = 2 + 10 + 24 + 12 + 10 = 58. Mean = 58 ÷ 20 = 2.9.","dg":{"t":"bar","title":"Students per mark","x":["1","2","3","4","5"],"y":[2,5,8,3,2],"unit":"No. of students"}},{"s":"Mathematics","t":"Statistics","d":2,"q":"The pie chart shows the number of students offering four subjects in a class of 60. Find the angle of the sector for English.","o":["72°","90°","108°","144°"],"a":2,"why":"English has 18 of the 60 students: 18/60 × 360° = 108°.","dg":{"t":"pie","labels":["Maths","English","Science","Art"],"vals":[12,18,6,24]}},{"s":"Mathematics","t":"Statistics","d":3,"q":"The bar chart shows the number of goals scored per match in 20 matches. Find the median number of goals.","o":["1.5","1","2","1.8"],"a":0,"why":"The 10th and 11th scores (in order) are needed. Cumulative frequencies: 0 goals → 3, 1 goal → 10, 2 goals → 16. The 10th is 1 and the 11th is 2, so median = (1 + 2)/2 = 1.5.","dg":{"t":"bar","title":"Goals per match","x":["0","1","2","3","4"],"y":[3,7,6,2,2],"unit":"No. of matches"}},{"s":"Mathematics","t":"Probability","d":2,"q":"Two fair dice are thrown. Find the probability that the sum of the scores is 8.","o":["1/6","1/9","7/36","5/36"],"a":3,"why":"Favourable outcomes: (2,6), (3,5), (4,4), (5,3), (6,2) = 5 out of 36, so the probability is 5/36."},{"s":"Mathematics","t":"Probability","d":2,"q":"The Venn diagram shows the number of students who take Art (A) and Biology (B) in a class of 20. If a student is chosen at random, what is the probability that the student takes Art?","o":["1/4","2/5","3/20","13/20"],"a":1,"why":"Students taking Art = 5 + 3 = 8 out of 20, so P(Art) = 8/20 = 2/5.","dg":{"t":"venn","sets":["A","B"],"reg":{"A":"5","B":"8","AB":"3","out":"4"}}},{"s":"Mathematics","t":"Probability","d":3,"q":"A and B are independent events with P(A) = 0.5 and P(B) = 0.3. Find P(A ∪ B).","o":["0.8","0.15","0.35","0.65"],"a":3,"why":"P(A ∩ B) = 0.5 × 0.3 = 0.15. P(A ∪ B) = 0.5 + 0.3 − 0.15 = 0.65."},{"s":"Mathematics","t":"Polynomials and functions","d":2,"q":"Find the remainder when x³ − 2x + 5 is divided by (x − 2).","o":["1","9","5","17"],"a":1,"why":"By the remainder theorem, the remainder is f(2) = 8 − 4 + 5 = 9."},{"s":"Mathematics","t":"Polynomials and functions","d":3,"q":"If (x − 2) is a factor of x³ − 3x² + kx + 6, find k.","o":["−1","1","−3","2"],"a":0,"why":"By the factor theorem f(2) = 0: 8 − 12 + 2k + 6 = 0, so 2 + 2k = 0 and k = −1."},{"s":"Mathematics","t":"Loci and constructions","d":1,"q":"The locus of points equidistant from two fixed points P and Q is","o":["a circle with PQ as diameter","a line parallel to PQ","the perpendicular bisector of PQ","the bisector of an angle at P"],"a":2,"why":"Every point on the perpendicular bisector of PQ is the same distance from P as from Q, so that line is the locus."},{"s":"Mathematics","t":"Sequences and series","d":1,"q":"Find the 10th term of the arithmetic progression 3, 7, 11, ...","o":["43","39","36","40"],"a":1,"why":"Tₙ = a + (n − 1)d = 3 + 9 × 4 = 39."},{"s":"Mathematics","t":"Sequences and series","d":3,"q":"Find the sum to infinity of the geometric progression 12, 6, 3, ...","o":["18","21","48","24"],"a":3,"why":"a = 12, r = 6/12 = ½. S∞ = a/(1 − r) = 12/(½) = 24."},{"s":"Mathematics","t":"Permutation and combination","d":2,"q":"In how many different ways can the letters of the word LEVEL be arranged?","o":["60","120","30","15"],"a":2,"why":"There are 5 letters with L repeated twice and E repeated twice: 5!/(2! × 2!) = 120/4 = 30."},{"s":"Mathematics","t":"Matrices and determinants","d":1,"q":"Find the determinant of the matrix with first row (3  2) and second row (1  4).","o":["10","14","12","−10"],"a":0,"why":"det = (3 × 4) − (2 × 1) = 12 − 2 = 10."},{"s":"Mathematics","t":"Matrices and determinants","d":2,"q":"The matrix with first row (2  1) and second row (x  3) is singular. Find x.","o":["6","3","−6","2"],"a":0,"why":"A singular matrix has determinant 0: 2 × 3 − 1 × x = 0, so x = 6."},{"s":"Mathematics","t":"Vectors and transformation","d":2,"q":"If a = (3, 2) and b = (1, −4) are column vectors, find a + 2b.","o":["(4, −2)","(5, 6)","(5, −6)","(7, −2)"],"a":2,"why":"2b = (2, −8). a + 2b = (3 + 2, 2 − 8) = (5, −6)."},{"s":"Mathematics","t":"Differentiation","d":1,"q":"Differentiate y = 4x³ − 2x with respect to x.","o":["12x³ − 2","4x² − 2","12x² − 2x","12x² − 2"],"a":3,"why":"Multiply by the power and reduce it by 1: d/dx(4x³) = 12x², d/dx(2x) = 2, so dy/dx = 12x² − 2."},{"s":"Mathematics","t":"Differentiation","d":2,"q":"Find the minimum value of y = x² − 6x + 5.","o":["3","−4","−9","5"],"a":1,"why":"dy/dx = 2x − 6 = 0 gives x = 3. y = 9 − 18 + 5 = −4, which is a minimum since the x² coefficient is positive."},{"s":"Mathematics","t":"Integration","d":2,"q":"Evaluate ∫ from 0 to 2 of (3x² + 2) dx.","o":["8","10","12","16"],"a":2,"why":"∫(3x² + 2)dx = x³ + 2x. At 2: 8 + 4 = 12; at 0: 0. So the value is 12."},{"s":"Mathematics","t":"Modular arithmetic","d":2,"q":"Find the value of (7 × 8) in modulo 9.","o":["2","1","6","5"],"a":0,"why":"7 × 8 = 56 = 6 × 9 + 2, so 56 ≡ 2 (mod 9)."},{"s":"Mathematics","t":"Binary operations","d":2,"q":"A binary operation * is defined by a * b = 2a + b − 1. Evaluate (2 * 3) * 1.","o":["9","11","13","12"],"a":3,"why":"2 * 3 = 4 + 3 − 1 = 6. Then 6 * 1 = 12 + 1 − 1 = 12."},{"s":"Mathematics","t":"Algebraic fractions","d":2,"q":"Simplify (x² − 9)/(x² + x − 6).","o":["(x + 3)/(x − 2)","(x − 3)/(x − 2)","(x − 3)/(x + 2)","(x − 9)/(x − 6)"],"a":1,"why":"Factorise: (x − 3)(x + 3) / [(x + 3)(x − 2)]. Cancel (x + 3) to get (x − 3)/(x − 2)."},{"s":"Mathematics","t":"Financial arithmetic","d":2,"q":"Find the compound interest on ₦20,000 for 2 years at 10% per annum, compounded annually.","o":["₦4,000","₦24,200","₦3,800","₦4,200"],"a":3,"why":"Amount = 20,000 × (1.1)² = ₦24,200. Interest = 24,200 − 20,000 = ₦4,200."},{"s":"Mathematics","t":"Integers and rational numbers","d":2,"q":"Simplify 2/3 + 3/4 ÷ 1/2.","o":["17/12","13/6","5/6","9/8"],"a":1,"why":"Division comes first: 3/4 ÷ 1/2 = 3/4 × 2 = 3/2. Then 2/3 + 3/2 = 4/6 + 9/6 = 13/6."},{"s":"Mathematics","t":"Percentages extras","d":1,"q":"The pie chart shows how a worker spends a monthly salary of ₦60,000. The figures are percentages. How much is spent on transport?","o":["₦12,000","₦20,000","₦6,000","₦18,000"],"a":0,"why":"Transport is 20% of ₦60,000 = 20/100 × 60,000 = ₦12,000.","dg":{"t":"pie","labels":["Food","Rent","Transport","Savings"],"vals":[40,30,20,10]}},{"s":"Mathematics","t":"Parallel lines / intercept theorem","d":2,"q":"In the diagram, the two horizontal lines are parallel and are cut by a transversal. Find x.","o":["65°","25°","115°","135°"],"a":2,"why":"The angle below-left of Q corresponds to the angle below-left of P, which is on a straight line with 65°: 180° − 65° = 115°. Corresponding angles between parallel lines are equal, so x = 115°.","dg":{"t":"svg","svg":"<svg viewBox=\"0 0 320 190\"><line x1=\"30\" y1=\"60\" x2=\"290\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"30\" y1=\"130\" x2=\"290\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"90\" y1=\"15\" x2=\"190\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"298\" y=\"60\" font-size=\"12\" dominant-baseline=\"middle\">P</text><text x=\"298\" y=\"130\" font-size=\"12\" dominant-baseline=\"middle\">Q</text><text x=\"96\" y=\"46\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">65°</text><text x=\"140\" y=\"144\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">x</text><polygon points=\"270,52 280,56 270,60\" fill=\"currentColor\"/><polygon points=\"270,122 280,126 270,130\" fill=\"currentColor\"/></svg>"}},{"s":"Mathematics","t":"Parallel lines / intercept theorem","d":2,"q":"In the diagram, DE is parallel to BC, AD = 4 cm, DB = 2 cm and AE = 6 cm. Find EC (marked x).","o":["9 cm","3 cm","4 cm","12 cm"],"a":1,"why":"By the intercept theorem AD/DB = AE/EC, so 4/2 = 6/x and x = 6 × 2 ÷ 4 = 3 cm.","dg":{"t":"svg","svg":"<svg viewBox=\"0 0 320 190\"><polygon points=\"150,20 50,170 270,170\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"83\" y1=\"120\" x2=\"230\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150\" y=\"9\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">A</text><text x=\"36\" y=\"176\" font-size=\"13\" font-weight=\"700\">B</text><text x=\"278\" y=\"176\" font-size=\"13\" font-weight=\"700\">C</text><text x=\"70\" y=\"112\" font-size=\"13\" font-weight=\"700\">D</text><text x=\"238\" y=\"112\" font-size=\"13\" font-weight=\"700\">E</text><text x=\"92\" y=\"64\" font-size=\"12\">4 cm</text><text x=\"48\" y=\"148\" font-size=\"12\">2 cm</text><text x=\"214\" y=\"64\" font-size=\"12\">6 cm</text><text x=\"262\" y=\"148\" font-size=\"12\">x</text></svg>"}},{"s":"Mathematics","t":"Mensuration","d":2,"q":"Two towns lie on the same meridian, one at latitude 20°N and the other at 35°S. Find the distance between them in nautical miles. [1 minute of arc = 1 nautical mile]","o":["1,500 nm","3,600 nm","900 nm","3,300 nm"],"a":3,"why":"The angular difference = 20° + 35° = 55° (opposite hemispheres). Distance = 55 × 60 = 3,300 nm."},{"s":"Mathematics","t":"Graphs of quadratic functions: tangents and gradients;","d":2,"q":"Find the gradient of the tangent to the curve y = x² − 2x at the point where x = 3.","o":["3","6","4","−4"],"a":2,"why":"dy/dx = 2x − 2. At x = 3, the gradient = 6 − 2 = 4."},{"s":"Mathematics","t":"Similar solids (volumes)","d":3,"q":"Two similar cones have heights 4 cm and 6 cm. If the smaller has volume 16 cm³, find the volume of the larger cone.","o":["54 cm³","24 cm³","36 cm³","81 cm³"],"a":0,"why":"The volume ratio is the cube of the length ratio: (6/4)³ = 27/8. So volume = 16 × 27/8 = 54 cm³."},{"s":"Physics","t":"Measurements and units","d":1,"q":"Which of the following is a derived unit?","o":["newton","kilogram","metre","kelvin"],"a":0,"why":"The kilogram, metre and kelvin are SI base units. The newton is derived: 1 N = 1 kg m s⁻²."},{"s":"Physics","t":"Measurements and units","d":3,"q":"The SI base units of pressure are","o":["kg m s⁻²","kg m⁻¹ s⁻²","kg m² s⁻²","kg m⁻² s⁻¹"],"a":1,"why":"Pressure = force/area. Force is kg m s⁻² and area is m², so pressure is kg m s⁻² ÷ m² = kg m⁻¹ s⁻²."},{"s":"Physics","t":"Motion","d":2,"q":"The graph shows the distance covered by a cyclist at 2-second intervals. What is the average speed for the whole 10 s?","o":["5 m/s","2 m/s","3 m/s","6 m/s"],"a":2,"why":"Average speed = total distance ÷ total time = 30 m ÷ 10 s = 3 m/s. The flat part (4 s to 8 s) is when the cyclist is at rest but the time still counts.","dg":{"t":"line","title":"Distance (m) against time (s)","x":["0","2","4","6","8","10"],"y":[0,10,20,20,20,30],"unit":"m"}},{"s":"Physics","t":"Motion","d":2,"q":"The graph shows velocity of a car at 2-second intervals from rest. The distance covered in the 8 s is","o":["64 m","32 m","24 m","48 m"],"a":3,"why":"Distance = area under the v-t graph. 0-4 s: ½ × 4 × 8 = 16 m. 4-8 s: 8 × 4 = 32 m. Total = 48 m.","dg":{"t":"line","title":"Velocity (m/s) against time (s)","x":["0","2","4","6","8"],"y":[0,4,8,8,8],"unit":"m/s"}},{"s":"Physics","t":"Motion","d":2,"q":"A stone is dropped from the top of a building 45 m high. Taking g = 10 m/s², the time to reach the ground is","o":["3 s","4.5 s","9 s","2.1 s"],"a":0,"why":"h = ½gt², so t = √(2h/g) = √(2×45/10) = √9 = 3 s."},{"s":"Physics","t":"Atomic and nuclear physics","d":2,"q":"A radium nucleus of mass number 226 and atomic number 88 emits an alpha particle. The daughter nucleus has mass number and atomic number respectively","o":["226 and 87","222 and 86","224 and 86","222 and 88"],"a":1,"why":"An alpha particle is a helium nucleus (mass number 4, atomic number 2). Mass number: 226 - 4 = 222; atomic number: 88 - 2 = 86."},{"s":"Physics","t":"Mechanics","d":2,"q":"A 4 kg block is pushed along a horizontal surface by a 20 N force against a frictional force of 8 N as shown. Its acceleration is","o":["5 m/s²","7 m/s²","3 m/s²","2 m/s²"],"a":2,"why":"Net force = 20 - 8 = 12 N. a = F/m = 12 ÷ 4 = 3 m/s².","dg":{"t":"force","body":"4 kg","forces":[{"dir":"right","label":"20 N"},{"dir":"left","label":"8 N"},{"dir":"up","label":"R"},{"dir":"down","label":"W"}]}},{"s":"Physics","t":"Forces and equilibrium","d":2,"q":"A uniform metre rule is pivoted at its 50 cm mark. A 6 N weight hangs at the 30 cm mark. At which mark must a 4 N weight be hung to balance the rule?","o":["70 cm mark","75 cm mark","80 cm mark","85 cm mark"],"a":2,"why":"The rule is pivoted at its centre, so its own weight has no turning effect. Moments: 6 × 20 = 4 × d gives d = 30 cm on the other side, so the 80 cm mark."},{"s":"Physics","t":"Forces and equilibrium","d":2,"q":"A 10 kg block slides down a smooth plane inclined at 30° to the horizontal. Its acceleration down the plane is (g = 10 m/s²)","o":["5 m/s²","10 m/s²","8.7 m/s²","2.5 m/s²"],"a":0,"why":"On a smooth slope a = g sin θ = 10 × sin 30° = 10 × 0.5 = 5 m/s², independent of the mass.","dg":{"t":"incline","angle":"30°","body":"10 kg"}},{"s":"Physics","t":"Forces and equilibrium","d":1,"q":"A block of weight 50 N is pulled along a rough horizontal floor at constant velocity by a horizontal force of 12 N. The frictional force f is","o":["50 N","12 N","38 N","62 N"],"a":1,"why":"Constant velocity means zero acceleration, so the forces balance: friction f equals the pulling force, 12 N.","dg":{"t":"force","body":"50 N","forces":[{"dir":"right","label":"12 N"},{"dir":"left","label":"f"},{"dir":"up","label":"R"},{"dir":"down","label":"W"}]}},{"s":"Physics","t":"Energy","d":1,"q":"The potential energy of a 5 kg mass raised through 8 m is (g = 10 m/s²)","o":["40 J","80 J","400 J","13 J"],"a":2,"why":"PE = mgh = 5 × 10 × 8 = 400 J."},{"s":"Physics","t":"Energy","d":2,"q":"A man of mass 60 kg climbs a flight of stairs 10 m high in 20 s. His average power is (g = 10 m/s²)","o":["600 W","30 W","6000 W","300 W"],"a":3,"why":"Work = mgh = 60 × 10 × 10 = 6000 J. Power = work ÷ time = 6000 ÷ 20 = 300 W."},{"s":"Physics","t":"Mechanics","d":2,"q":"A 4 kg load hangs from a rope inside a lift. The tension in the rope is 48 N, as shown. The acceleration of the lift is (g = 10 m/s²)","o":["2 m/s² upward","2 m/s² downward","12 m/s² upward","0"],"a":0,"why":"Weight = 4 × 10 = 40 N. Net upward force = 48 - 40 = 8 N, so a = 8 ÷ 4 = 2 m/s², upward since the tension is larger.","dg":{"t":"force","body":"4 kg","forces":[{"dir":"up","label":"T = 48 N"},{"dir":"down","label":"W = 40 N"}]}},{"s":"Physics","t":"Gravitation and elasticity","d":3,"q":"The graph shows the extension of a spring for different loads. The force constant of the spring is","o":["2.5 N/m","250 N/m","4 N/m","25 N/m"],"a":1,"why":"k = F/e, using any point: 10 N gives 4 cm = 0.04 m, so k = 10 ÷ 0.04 = 250 N/m. Convert cm to m before dividing.","dg":{"t":"line","title":"Extension (cm) against load (N)","x":["0","5","10","15","20"],"y":[0,2,4,6,8],"unit":"cm"}},{"s":"Physics","t":"Gravitation and elasticity","d":1,"q":"If the distance between two masses is doubled, the gravitational force between them becomes","o":["one half","twice","one quarter","four times"],"a":2,"why":"Newton's law: F ∝ 1/r². Doubling r divides F by 2² = 4, so the force is one quarter."},{"s":"Physics","t":"Pressure and liquids at rest","d":2,"q":"The pressure due to the water alone at a depth of 20 m in a lake is (density of water = 1000 kg/m³, g = 10 m/s²)","o":["2×10⁴ Pa","3×10⁵ Pa","1×10⁵ Pa","2×10⁵ Pa"],"a":3,"why":"P = ρgh = 1000 × 10 × 20 = 2×10⁵ Pa. Adding atmospheric pressure would give 3×10⁵ Pa, but the question asks for water alone."},{"s":"Physics","t":"Pressure and liquids at rest","d":3,"q":"A body weighs 8 N in air and 6 N when completely immersed in water. Its relative density is","o":["4","1.3","3","2"],"a":0,"why":"Upthrust = 8 - 6 = 2 N. Relative density = weight in air ÷ upthrust = 8 ÷ 2 = 4."},{"s":"Physics","t":"Pressure and liquids at rest","d":2,"q":"In a hydraulic press the small piston has area 5 cm² and the large piston 100 cm². A force of 40 N on the small piston can support a load of","o":["2 N","800 N","200 N","8000 N"],"a":1,"why":"Pressure is transmitted equally: F₂ = F₁ × A₂/A₁ = 40 × 100/5 = 800 N."},{"s":"Physics","t":"Temperature and heat","d":3,"q":"200 g of water at 80 °C is mixed with 300 g of water at 20 °C in a well-lagged container. The final temperature is","o":["50 °C","56 °C","44 °C","40 °C"],"a":2,"why":"Heat lost = heat gained: 200(80 - T) = 300(T - 20), so 16000 - 200T = 300T - 6000, giving 500T = 22000 and T = 44 °C."},{"s":"Physics","t":"Temperature and heat","d":1,"q":"The graph shows temperature readings when a pure solid is heated at a steady rate. The melting point of the solid is","o":["60 °C","90 °C","70 °C","80 °C"],"a":3,"why":"During melting the temperature stays constant while energy goes into breaking the solid structure (latent heat). The flat part of the graph is at 80 °C.","dg":{"t":"line","title":"Temperature (°C) against time (min)","x":["0","2","4","6","8","10"],"y":[60,70,80,80,80,90],"unit":"°C"}},{"s":"Physics","t":"Gas laws and kinetic theory","d":2,"q":"A fixed mass of gas occupies 600 cm³ at 27 °C. At constant pressure it is heated to 127 °C. Its new volume is","o":["800 cm³","1200 cm³","450 cm³","2800 cm³"],"a":0,"why":"Charles' law with Kelvin temperatures: V₂ = 600 × 400/300 = 800 cm³. Using °C directly gives wrong answers."},{"s":"Physics","t":"Gas laws and kinetic theory","d":1,"q":"When a gas in a closed rigid container is heated, its pressure rises because the molecules","o":["become larger","move faster and hit the walls more often and with greater force","get heavier","attract each other more strongly"],"a":1,"why":"Higher temperature raises the average kinetic energy of the molecules, so collisions with the walls are more frequent and harder, raising the pressure."},{"s":"Physics","t":"Waves","d":3,"q":"A closed pipe 0.85 m long is sounded at its fundamental frequency. If the speed of sound in air is 340 m/s, the frequency is","o":["200 Hz","400 Hz","100 Hz","50 Hz"],"a":2,"why":"In a closed pipe the fundamental has λ = 4L = 3.4 m, so f = v/λ = 340 ÷ 3.4 = 100 Hz."},{"s":"Physics","t":"Optics","d":3,"q":"An object is placed 30 cm from a converging lens of focal length 10 cm. The image is","o":["15 cm from the lens and virtual","7.5 cm from the lens and real","30 cm from the lens and real","15 cm from the lens and real"],"a":3,"why":"1/v = 1/f - 1/u = 1/10 - 1/30 = 2/30, so v = 15 cm. The object is beyond f, so v is positive and the image is real."},{"s":"Physics","t":"Dispersion of light and colours","d":2,"q":"Which colour of light travels fastest in glass?","o":["Red","Violet","Green","Yellow"],"a":0,"why":"Glass has the lowest refractive index for red light, so red travels fastest and is deviated least; violet is slowest and deviated most."},{"s":"Physics","t":"Electrostatics","d":3,"q":"A 6 μF and a 3 μF capacitor are connected in series across a 90 V supply. The potential difference across the 3 μF capacitor is","o":["30 V","60 V","90 V","45 V"],"a":1,"why":"Series capacitance = (6×3)/(6+3) = 2 μF. Charge on each = 2 × 90 = 180 μC. V across 3 μF = Q/C = 180/3 = 60 V."},{"s":"Physics","t":"Current electricity","d":1,"q":"In the circuit shown, the current drawn from the cell is","o":["6 A","3 A","2 A","1.5 A"],"a":2,"why":"The resistors are in series: R = 2 + 4 = 6 Ω. I = V/R = 12 ÷ 6 = 2 A.","dg":{"t":"circuit","kind":"series","cell":"12 V","comps":["R1 = 2 Ω","R2 = 4 Ω"]}},{"s":"Physics","t":"Current electricity","d":2,"q":"In the circuit shown, the total current drawn from the 12 V cell is","o":["0.67 A","2 A","1 A","3 A"],"a":3,"why":"Each branch has the full 12 V: I₁ = 12/6 = 2 A, I₂ = 12/12 = 1 A. Total current = 2 + 1 = 3 A.","dg":{"t":"circuit","kind":"parallel","cell":"12 V","comps":["R1 = 6 Ω","R2 = 12 Ω"]}},{"s":"Physics","t":"Current electricity","d":3,"q":"A cell of e.m.f. 12 V and internal resistance 1 Ω is connected to a 5 Ω resistor. The terminal potential difference is","o":["10 V","12 V","2 V","6 V"],"a":0,"why":"I = E/(R + r) = 12/6 = 2 A. Terminal p.d. = IR = 2 × 5 = 10 V (equivalently 12 - Ir = 12 - 2)."},{"s":"Physics","t":"Current electricity","d":2,"q":"The graph shows the p.d. across a conductor for different currents. The resistance of the conductor is","o":["0.25 Ω","4 Ω","2 Ω","8 Ω"],"a":1,"why":"R = V/I. At I = 2 A, V = 8 V, so R = 8/2 = 4 Ω. The straight line through the origin shows it obeys Ohm's law.","dg":{"t":"line","title":"p.d. (V) against current (A)","x":["0","0.5","1","1.5","2"],"y":[0,2,4,6,8],"unit":"V"}},{"s":"Physics","t":"Current electricity","d":2,"q":"Three resistors are connected in series to a 24 V cell as shown. The potential difference across the 6 Ω resistor is","o":["24 V","8 V","12 V","6 V"],"a":2,"why":"Total R = 4 + 6 + 2 = 12 Ω, I = 24/12 = 2 A. V across 6 Ω = 2 × 6 = 12 V.","dg":{"t":"circuit","kind":"series","cell":"24 V","comps":["R1 = 4 Ω","R2 = 6 Ω","R3 = 2 Ω"]}},{"s":"Physics","t":"Magnetism and electromagnetism","d":3,"q":"An ideal transformer steps 240 V down to 12 V and delivers a current of 5 A in the secondary. The primary current is","o":["5 A","100 A","0.05 A","0.25 A"],"a":3,"why":"For an ideal transformer, power in = power out: 240 × Ip = 12 × 5 = 60 W, so Ip = 60/240 = 0.25 A."},{"s":"Physics","t":"Simple harmonic motion","d":2,"q":"The period of a simple pendulum of length 2.5 m is (g = 10 m/s², π = 3.14)","o":["3.1 s","6.3 s","1.6 s","0.5 s"],"a":0,"why":"T = 2π√(L/g) = 2π√(2.5/10) = 2π × 0.5 = π ≈ 3.1 s."},{"s":"Physics","t":"A.C. circuits","d":1,"q":"An alternating current has a peak value of 10 A. Its r.m.s. value is","o":["5.0 A","7.1 A","14.1 A","10 A"],"a":1,"why":"I(rms) = I₀/√2 = 10/1.414 ≈ 7.1 A."},{"s":"Physics","t":"A.C. circuits","d":2,"q":"The reactance of a 0.1 H inductor at a frequency of 50 Hz is (π = 3.14)","o":["314 Ω","3.14 Ω","31.4 Ω","0.5 Ω"],"a":2,"why":"X(L) = 2πfL = 2 × 3.14 × 50 × 0.1 = 31.4 Ω."},{"s":"Physics","t":"Atomic and nuclear physics","d":2,"q":"The graph shows the count rate of a radioactive sample over time. The half-life of the sample is","o":["8 days","12 days","2 days","4 days"],"a":3,"why":"The count rate halves every 4 days (800 to 400, 400 to 200, 200 to 100), so the half-life is 4 days.","dg":{"t":"bar","title":"Count rate (counts/min) against time (days)","x":["0","4","8","12"],"y":[800,400,200,100],"unit":"counts/min"}},{"s":"Physics","t":"Scalars and vectors","d":1,"q":"Two forces of 8 N and 6 N act at right angles to each other on a body as shown. The magnitude of the resultant force is","o":["10 N","14 N","2 N","7 N"],"a":0,"why":"For perpendicular forces use Pythagoras: R = √(8² + 6²) = √100 = 10 N.","dg":{"t":"force","body":"Body","forces":[{"dir":"right","label":"8 N"},{"dir":"up","label":"6 N"}]}},{"s":"Physics","t":"Heat transfer","d":1,"q":"Heat from the Sun reaches the Earth mainly by","o":["conduction","radiation","convection","evaporation"],"a":1,"why":"Space is almost a vacuum, so conduction and convection (which need matter) cannot carry the heat. Thermal radiation travels through a vacuum."},{"s":"Physics","t":"Conduction of electricity through liquids and gases","d":2,"q":"The electrochemical equivalent of a metal is 3×10⁻⁷ kg/C. The mass deposited by a current of 2 A flowing for 500 s is","o":["3×10⁻⁷ kg","1.5×10⁻⁴ kg","3×10⁻⁴ kg","6×10⁻⁴ kg"],"a":2,"why":"Faraday's first law: m = Zit = 3×10⁻⁷ × 2 × 500 = 3×10⁻⁴ kg."},{"s":"Physics","t":"Modern physics and electronics","d":3,"q":"Photons of energy 5 eV fall on a metal of work function 2 eV. The maximum kinetic energy of the emitted electrons is","o":["7 eV","2.5 eV","10 eV","3 eV"],"a":3,"why":"Einstein's photoelectric equation: E = φ + KEmax, so KEmax = 5 - 2 = 3 eV."},{"s":"Chemistry","t":"Structure of atom detail","d":1,"q":"An atom of sodium has atomic number 11 and mass number 23. The number of neutrons is","o":["12","11","23","34"],"a":0,"why":"Neutrons = mass number - atomic number = 23 - 11 = 12."},{"s":"Chemistry","t":"Structure of atom detail","d":2,"q":"Chlorine consists of 75% ³⁵Cl and 25% ³⁷Cl. Its relative atomic mass is","o":["36.0","35.5","35.0","36.5"],"a":1,"why":"RAM = (75×35 + 25×37)/100 = (2625 + 925)/100 = 35.5."},{"s":"Chemistry","t":"Bonding","d":2,"q":"Which of these species contains a coordinate (dative) covalent bond?","o":["CH₄","NaCl","NH₄⁺","MgO"],"a":2,"why":"In the ammonium ion, the nitrogen lone pair in NH₃ is donated to an H⁺ ion, forming a coordinate bond. CH₄ is purely covalent; NaCl and MgO are ionic."},{"s":"Chemistry","t":"Bonding","d":2,"q":"Graphite conducts electricity because","o":["it has free ions","its layers are held by strong covalent bonds","it contains metallic bonds throughout","it has delocalised electrons between its layers"],"a":3,"why":"Each carbon uses three electrons in bonding; the fourth is delocalised and free to move along the layers, carrying charge."},{"s":"Chemistry","t":"Separation of mixtures","d":1,"q":"The best method of separating a mixture of ethanol and water is","o":["fractional distillation","filtration","sublimation","decantation"],"a":0,"why":"Both are miscible liquids with different boiling points (ethanol about 78 °C, water 100 °C), so fractional distillation separates them."},{"s":"Chemistry","t":"Mole concept","d":1,"q":"The number of moles in 5.3 g of Na₂CO₃ is (Na = 23, C = 12, O = 16)","o":["0.5 mol","0.05 mol","0.1 mol","20 mol"],"a":1,"why":"M(Na₂CO₃) = 46 + 12 + 48 = 106 g/mol. Moles = 5.3 ÷ 106 = 0.05 mol."},{"s":"Chemistry","t":"Mole concept","d":2,"q":"The pie chart shows the percentage by mass of the elements in calcium carbonate, CaCO₃. The mass of oxygen in 25 g of CaCO₃ is","o":["10 g","3 g","12 g","15 g"],"a":2,"why":"Oxygen is 48% of the compound: 48/100 × 25 = 12 g. (M = 100: Ca 40, C 12, O 48.)","dg":{"t":"pie","labels":["Ca","C","O"],"vals":[40,12,48]}},{"s":"Chemistry","t":"Mole concept","d":3,"q":"What volume of hydrogen at s.t.p. is liberated when 5.4 g of aluminium reacts with excess dilute HCl? 2Al + 6HCl → 2AlCl₃ + 3H₂ (Al = 27; molar volume = 22.4 dm³)","o":["4.48 dm³","10.08 dm³","13.44 dm³","6.72 dm³"],"a":3,"why":"Moles Al = 5.4/27 = 0.2. From the equation 2 mol Al gives 3 mol H₂, so 0.2 mol gives 0.3 mol H₂. Volume = 0.3 × 22.4 = 6.72 dm³."},{"s":"Chemistry","t":"Mole concept","d":2,"q":"The number of molecules in 16 g of oxygen gas, O₂, is (O = 16; Avogadro constant = 6.02×10²³)","o":["3.01×10²³","6.02×10²³","1.20×10²⁴","1.51×10²³"],"a":0,"why":"M(O₂) = 32 g/mol, so 16 g = 0.5 mol. Molecules = 0.5 × 6.02×10²³ = 3.01×10²³."},{"s":"Chemistry","t":"States of matter and gas laws","d":3,"q":"400 cm³ of a gas at 300 K and 1 atm is heated to 600 K while the pressure is raised to 2 atm. The new volume is","o":["800 cm³","400 cm³","200 cm³","1600 cm³"],"a":1,"why":"P₁V₁/T₁ = P₂V₂/T₂: V₂ = (1 × 400 × 600)/(300 × 2) = 400 cm³. The doubling of T and of P cancel."},{"s":"Chemistry","t":"States of matter and gas laws","d":2,"q":"According to Graham's law, the ratio of the rate of diffusion of hydrogen to that of oxygen under the same conditions is (H = 1, O = 16)","o":["16 : 1","2 : 1","4 : 1","8 : 1"],"a":2,"why":"Rate ∝ 1/√M. Rate(H₂)/Rate(O₂) = √(32/2) = √16 = 4, so 4 : 1."},{"s":"Chemistry","t":"Acids and bases","d":1,"q":"A solution has hydrogen ion concentration 1×10⁻³ mol/dm³. Its pH is","o":["11","-3","0.001","3"],"a":3,"why":"pH = -log[H⁺] = -log(10⁻³) = 3. The solution is acidic."},{"s":"Chemistry","t":"Acids and bases","d":2,"q":"25.0 cm³ of 0.100 mol/dm³ NaOH neutralises 20.0 cm³ of HCl solution. The concentration of the HCl is","o":["0.125 mol/dm³","0.080 mol/dm³","0.250 mol/dm³","0.500 mol/dm³"],"a":0,"why":"NaOH + HCl → NaCl + H₂O (1 : 1). Moles NaOH = 0.025 × 0.1 = 0.0025 mol. Conc. HCl = 0.0025 ÷ 0.020 = 0.125 mol/dm³."},{"s":"Chemistry","t":"Rates of reaction","d":2,"q":"The graph shows the volume of hydrogen collected at intervals when magnesium reacts with dilute acid. The average rate during the first 20 s is","o":["1.8 cm³/s","1.5 cm³/s","0.8 cm³/s","0.6 cm³/s"],"a":1,"why":"Average rate = volume ÷ time = 30 cm³ ÷ 20 s = 1.5 cm³/s. The curve flattens at 40 cm³ when the reaction ends.","dg":{"t":"line","title":"Volume of H₂ (cm³) against time (s)","x":["0","10","20","30","40","50"],"y":[0,18,30,36,40,40],"unit":"cm³"}},{"s":"Chemistry","t":"Rates of reaction","d":1,"q":"Increasing the concentration of a reactant increases the rate of reaction because","o":["the activation energy is lowered","the particles move faster","particles collide more frequently","the products are removed"],"a":2,"why":"More particles per unit volume means more collisions per second, so more successful collisions. Concentration does not change activation energy or particle speed."},{"s":"Chemistry","t":"Energy changes and equilibrium","d":2,"q":"N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH = -92 kJ/mol. Which change increases the equilibrium yield of ammonia?","o":["Raising the temperature","Adding a catalyst","Decreasing the pressure","Increasing the pressure"],"a":3,"why":"There are 4 mol gas on the left and 2 mol on the right, so higher pressure shifts the equilibrium right. Raising temperature favours the endothermic (reverse) direction; a catalyst does not change the yield."},{"s":"Chemistry","t":"Redox and electrochemistry","d":2,"q":"The oxidation number of manganese in KMnO₄ is","o":["+7","+5","+2","-1"],"a":0,"why":"K is +1 and four O atoms are -8. For a neutral compound: +1 + x - 8 = 0, so x = +7."},{"s":"Chemistry","t":"Redox and electrochemistry","d":3,"q":"A current of 2 A is passed through copper(II) sulphate solution for 965 s. The mass of copper deposited is (Cu = 64; 1 F = 96500 C)","o":["1.28 g","0.64 g","0.32 g","6.4 g"],"a":1,"why":"Q = It = 2 × 965 = 1930 C = 0.02 mol of electrons. Cu²⁺ + 2e⁻ → Cu, so moles Cu = 0.01 and mass = 0.01 × 64 = 0.64 g."},{"s":"Chemistry","t":"Solutions and solubility","d":2,"q":"The bar chart shows the solubility of potassium nitrate at different temperatures. What mass of crystals forms when a saturated solution containing 100 g of water at 60 °C is cooled to 20 °C?","o":["110 g","32 g","78 g","142 g"],"a":2,"why":"Mass crystallising = solubility at 60 °C - solubility at 20 °C = 110 - 32 = 78 g.","dg":{"t":"bar","title":"Solubility of KNO₃ (g per 100 g water) at °C","x":["20","40","60","80"],"y":[32,64,110,169],"unit":"g/100 g water"}},{"s":"Chemistry","t":"Water, air and the environment","d":1,"q":"The pie chart shows the composition of dry air by volume. The volume of oxygen in 500 cm³ of air is about","o":["390 cm³","210 cm³","5 cm³","105 cm³"],"a":3,"why":"Oxygen is about 21% of air: 21/100 × 500 = 105 cm³.","dg":{"t":"pie","labels":["Nitrogen","Oxygen","Other gases"],"vals":[78,21,1]}},{"s":"Chemistry","t":"Non-metals and their compounds","d":2,"q":"The flow chart shows the stages of the Contact process. Which catalyst is used in stage 2?","o":["Vanadium(V) oxide","Iron","Nickel","Manganese(IV) oxide"],"a":0,"why":"Stage 2 is 2SO₂ + O₂ ⇌ 2SO₃, catalysed by vanadium(V) oxide, V₂O₅, at about 450 °C. Iron is for the Haber process and nickel for hydrogenation.","dg":{"t":"flow","steps":["1 S + O₂","2 SO₂ + O₂","3 SO₃ in acid","4 Oleum + H₂O"],"cycle":false}},{"s":"Chemistry","t":"Non-metals and their compounds","d":2,"q":"A gas turns acidified potassium dichromate(VI) solution from orange to green. The gas is","o":["carbon(IV) oxide","sulphur(IV) oxide","ammonia","hydrogen chloride"],"a":1,"why":"SO₂ is a reducing agent: it reduces orange Cr₂O₇²⁻ to green Cr³⁺. CO₂, NH₃ and HCl do not do this."},{"s":"Chemistry","t":"Metals and their compounds","d":2,"q":"In the blast furnace flow chart, the limestone added to the charge is used to","o":["supply carbon monoxide","act as the catalyst","remove silica as slag","raise the temperature"],"a":2,"why":"Limestone decomposes to CaO, which combines with silica (SiO₂) impurity to form calcium silicate slag, which floats on the molten iron.","dg":{"t":"flow","steps":["Ore+coke+lime","Hot air blast","Slag forms","Molten iron"],"cycle":false}},{"s":"Chemistry","t":"Metals and their compounds","d":2,"q":"Cryolite is added during the extraction of aluminium from alumina in order to","o":["act as the anode","oxidise the aluminium","increase the reactivity of aluminium","lower the melting point of the alumina"],"a":3,"why":"Pure alumina melts near 2000 °C. Dissolving it in molten cryolite allows electrolysis at about 950 °C, saving energy."},{"s":"Chemistry","t":"Organic chemistry","d":2,"q":"Ethanoic acid reacts with ethanol in the presence of concentrated H₂SO₄ to form","o":["ethyl ethanoate","ethanal","ethane","methyl ethanoate"],"a":0,"why":"This is esterification: acid + alcohol → ester + water. The ester is named from the alcohol (ethyl) then the acid (ethanoate)."},{"s":"Chemistry","t":"Petroleum and industrial chemistry","d":2,"q":"Cracking of petroleum fractions is the process of","o":["joining small molecules into polymers","breaking long-chain hydrocarbons into smaller alkanes and alkenes","separating crude oil by boiling point","adding hydrogen to alkenes"],"a":1,"why":"Cracking uses heat or a catalyst to break large molecules (e.g. from diesel) into shorter alkanes and alkenes, which are in higher demand."},{"s":"Chemistry","t":"Periodic Chemistry (detail)","d":2,"q":"The bar chart shows the first ionisation energies of some Group 1 elements. The decrease down the group is mainly due to","o":["increasing nuclear charge only","decreasing number of valence electrons","increasing atomic radius and shielding","decreasing atomic mass"],"a":2,"why":"Down the group the outer electron is further from the nucleus and more shielded, so it is held less strongly even though nuclear charge increases; less energy is needed to remove it.","dg":{"t":"bar","title":"First ionisation energy (kJ/mol)","x":["Li","Na","K","Rb"],"y":[520,496,419,403],"unit":"kJ/mol"}},{"s":"Chemistry","t":"Nuclear chemistry","d":2,"q":"Carbon-14 (atomic number 6) decays by emitting a beta particle. The daughter nuclide is","o":["carbon-13","boron-10","nitrogen-13","nitrogen-14"],"a":3,"why":"In beta decay a neutron becomes a proton: the atomic number rises by 1 (6 to 7, nitrogen) and the mass number stays 14."},{"s":"Chemistry","t":"Chemistry of carbon compounds detail","d":2,"q":"The bar chart shows the boiling points of four alkanes. The best prediction for nonane (C₉H₂₀) is that its boiling point is","o":["higher than that of octane because of stronger van der Waals forces","lower than octane because it is larger","the same as octane","lower because it has weaker covalent bonds"],"a":0,"why":"Boiling point rises with chain length: bigger molecules have stronger van der Waals forces between them, needing more energy to separate.","dg":{"t":"bar","title":"Boiling points of alkanes (°C)","x":["C₅H₁₂","C₆H₁₄","C₇H₁₆","C₈H₁₈"],"y":[36,69,98,126],"unit":"°C"}},{"s":"Chemistry","t":"Qualitative and quantitative analysis","d":3,"q":"Aqueous NaOH gives a white precipitate with solution Z, which dissolves in excess NaOH. The precipitate also dissolves in excess aqueous ammonia. Z contains","o":["Al³⁺","Zn²⁺","Pb²⁺","Ca²⁺"],"a":1,"why":"Zn(OH)₂ is amphoteric and also forms the soluble complex [Zn(NH₃)₄]²⁺ in excess ammonia. Al³⁺ and Pb²⁺ hydroxides dissolve in NaOH but not in ammonia; Ca(OH)₂ is insoluble in excess NaOH."},{"s":"Biology","t":"Cell biology","d":1,"q":"Which cell organelle is the site of protein synthesis?","o":["Mitochondrion","Golgi body","Ribosome","Lysosome"],"a":2,"why":"Ribosomes, found free in the cytoplasm or on rough endoplasmic reticulum, join amino acids into proteins."},{"s":"Biology","t":"Cell biology","d":2,"q":"In the diagram of a plant cell, which labelled part is made mainly of cellulose and gives the cell a fixed shape?","o":["A","B","C","D"],"a":0,"why":"The cell wall (A) is the thick outer layer of cellulose. B is the nucleus, C the large vacuole and D a chloroplast.","dg":{"t":"svg","svg":"<svg viewBox=\"0 0 300 200\"><rect x=\"40\" y=\"20\" width=\"160\" height=\"150\" rx=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><rect x=\"46\" y=\"26\" width=\"148\" height=\"138\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/><ellipse cx=\"125\" cy=\"105\" rx=\"45\" ry=\"38\" fill=\"currentColor\" fill-opacity=\"0.12\" stroke=\"currentColor\"/><circle cx=\"75\" cy=\"60\" r=\"14\" fill=\"currentColor\" fill-opacity=\"0.35\" stroke=\"currentColor\"/><ellipse cx=\"165\" cy=\"50\" rx=\"12\" ry=\"7\" fill=\"currentColor\" fill-opacity=\"0.35\" stroke=\"currentColor\"/><ellipse cx=\"165\" cy=\"150\" rx=\"12\" ry=\"7\" fill=\"currentColor\" fill-opacity=\"0.35\" stroke=\"currentColor\"/><g stroke=\"currentColor\"><line x1=\"198\" y1=\"30\" x2=\"235\" y2=\"30\"/><line x1=\"61\" y1=\"60\" x2=\"28\" y2=\"60\"/><line x1=\"150\" y1=\"105\" x2=\"235\" y2=\"105\"/><line x1=\"176\" y1=\"52\" x2=\"235\" y2=\"70\"/></g><g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\"><text x=\"243\" y=\"34\">A</text><text x=\"12\" y=\"64\">B</text><text x=\"243\" y=\"109\">C</text><text x=\"243\" y=\"74\">D</text></g></svg>"}},{"s":"Biology","t":"Cell biology","d":2,"q":"A student views a cell under a microscope. The drawing of the cell is 60 mm long and the actual cell is 0.2 mm long. What is the magnification?","o":["x30","x120","x3000","x300"],"a":3,"why":"Magnification = image size / actual size = 60 / 0.2 = 300."},{"s":"Biology","t":"Classification of living things","d":1,"q":"Mushrooms, yeast and bread moulds belong to the kingdom","o":["Plantae","Fungi","Protista","Animalia"],"a":1,"why":"Fungi are non-photosynthetic organisms with chitin cell walls that feed by absorbing nutrients from dead or living matter."},{"s":"Biology","t":"Classification of living things","d":2,"q":"A spider has eight legs and its body is divided into two regions, the cephalothorax and the abdomen. It belongs to the class","o":["Insecta","Arachnida","Crustacea","Myriapoda"],"a":1,"why":"Arachnids have four pairs of legs and two body regions; insects have three pairs of legs and three body regions."},{"s":"Biology","t":"Nutrition","d":1,"q":"A diet lacking vitamin C causes","o":["Rickets","Beriberi","Night blindness","Scurvy"],"a":3,"why":"Vitamin C is needed for healthy gums and skin; its deficiency causes scurvy. Rickets is due to vitamin D, beriberi to B1 and night blindness to vitamin A."},{"s":"Biology","t":"Photosynthesis","d":2,"q":"The graph shows the rate of photosynthesis of a plant at different light intensities. Beyond light intensity 3, the rate no longer rises. What is the most likely limiting factor?","o":["Carbon dioxide concentration","Light intensity","Oxygen concentration","Amount of starch in the leaf"],"a":0,"why":"When more light does not raise the rate, light is no longer limiting. Of the options, carbon dioxide concentration is the factor that can limit the rate.","dg":{"t":"line","title":"Rate of photosynthesis against light intensity","x":["0","1","2","3","4","5"],"y":[0,4,8,10,10,10],"unit":"arbitrary units"}},{"s":"Biology","t":"Photosynthesis","d":2,"q":"In the cross-section of a leaf, which labelled layer contains the most chloroplasts and is the main site of photosynthesis?","o":["A","C","B","D"],"a":2,"why":"B is the palisade mesophyll, made of tall closely packed cells full of chloroplasts. A is the upper epidermis, C the spongy mesophyll and D a stoma.","dg":{"t":"svg","svg":"<svg viewBox=\"0 0 300 200\"><g fill=\"currentColor\" fill-opacity=\"0.12\" stroke=\"currentColor\"><rect x=\"30\" y=\"30\" width=\"190\" height=\"12\"/><rect x=\"30\" y=\"42\" width=\"190\" height=\"40\"/><rect x=\"30\" y=\"82\" width=\"190\" height=\"50\"/><rect x=\"30\" y=\"132\" width=\"80\" height=\"12\"/><rect x=\"135\" y=\"132\" width=\"85\" height=\"12\"/></g><g stroke=\"currentColor\"><line x1=\"52\" y1=\"42\" x2=\"52\" y2=\"82\"/><line x1=\"74\" y1=\"42\" x2=\"74\" y2=\"82\"/><line x1=\"96\" y1=\"42\" x2=\"96\" y2=\"82\"/><line x1=\"118\" y1=\"42\" x2=\"118\" y2=\"82\"/><line x1=\"140\" y1=\"42\" x2=\"140\" y2=\"82\"/><line x1=\"162\" y1=\"42\" x2=\"162\" y2=\"82\"/><line x1=\"184\" y1=\"42\" x2=\"184\" y2=\"82\"/><line x1=\"206\" y1=\"42\" x2=\"206\" y2=\"82\"/></g><g fill=\"none\" stroke=\"currentColor\"><circle cx=\"60\" cy=\"105\" r=\"9\"/><circle cx=\"100\" cy=\"115\" r=\"8\"/><circle cx=\"150\" cy=\"100\" r=\"9\"/><circle cx=\"190\" cy=\"112\" r=\"8\"/></g><g stroke=\"currentColor\"><line x1=\"220\" y1=\"36\" x2=\"240\" y2=\"36\"/><line x1=\"220\" y1=\"62\" x2=\"240\" y2=\"62\"/><line x1=\"220\" y1=\"107\" x2=\"240\" y2=\"107\"/><line x1=\"122\" y1=\"138\" x2=\"122\" y2=\"170\"/></g><g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\"><text x=\"246\" y=\"40\">A</text><text x=\"246\" y=\"66\">B</text><text x=\"246\" y=\"111\">C</text><text x=\"118\" y=\"184\">D</text></g></svg>"}},{"s":"Biology","t":"Enzymes and respiration","d":2,"q":"The graph shows the activity of an enzyme at different temperatures. Why does activity fall sharply between 40 C and 60 C?","o":["The substrate has been used up","The enzyme molecules have become more concentrated","The enzyme has been converted into a substrate","The enzyme is denatured and its active site loses its shape"],"a":3,"why":"High temperature breaks the bonds that hold the enzyme in shape, so the active site no longer fits the substrate (denaturation).","dg":{"t":"line","title":"Enzyme activity against temperature","x":["10","20","30","40","50","60"],"y":[10,30,65,100,35,5],"unit":"% of maximum (x-axis: temperature in C)"}},{"s":"Biology","t":"Enzymes and respiration","d":3,"q":"A germinating seed consumes 200 cm3 of oxygen and releases 140 cm3 of carbon dioxide in the same time. Its respiratory quotient (RQ) and the likely respiratory substrate are","o":["1.0, carbohydrate","0.7, fat","1.4, protein","0.7, glucose"],"a":1,"why":"RQ = CO2 produced / O2 used = 140 / 200 = 0.7. A value near 0.7 shows that fat is being respired; carbohydrate gives about 1.0."},{"s":"Biology","t":"Circulatory system and blood","d":2,"q":"The flow chart shows the path of blood through the heart and lungs. Which blood vessel is labelled A?","o":["Aorta","Pulmonary vein","Pulmonary artery","Hepatic portal vein"],"a":2,"why":"Deoxygenated blood leaves the right ventricle through the pulmonary artery and goes to the lungs.","dg":{"t":"flow","steps":["Vena cava","Right atrium","Right ventricle","A","Lungs","Pulmonary vein","Left atrium"],"cycle":false}},{"s":"Biology","t":"Circulatory system and blood","d":2,"q":"The pie chart shows the composition of human blood by volume. What percentage of the blood volume is made up of cells (red cells, white cells and platelets)?","o":["45%","1%","44%","55%"],"a":0,"why":"Cells make up 44% + 1% = 45% of the volume; plasma makes up the other 55%.","dg":{"t":"pie","labels":["Plasma","Red blood cells","White cells and platelets"],"vals":[55,44,1]}},{"s":"Biology","t":"Excretion and homeostasis","d":2,"q":"A boy plays football in the sun and drinks very little water. Which change takes place in his body?","o":["Less ADH is released and a large volume of dilute urine is produced","More ADH is released and a large volume of dilute urine is produced","More ADH is released and a small volume of concentrated urine is produced","Less ADH is released and a small volume of concentrated urine is produced"],"a":2,"why":"Water loss makes the blood more concentrated, so the pituitary releases more ADH. The kidney then reabsorbs more water, giving little, concentrated urine."},{"s":"Biology","t":"Transport in plants","d":2,"q":"Which condition would reduce the rate of transpiration the most?","o":["High humidity of the air","Strong wind","High temperature","Bright sunlight"],"a":0,"why":"Humid air is already full of water vapour, so the diffusion gradient out of the leaf is small. Wind, heat and light all increase transpiration."},{"s":"Biology","t":"Nervous system and sense organs","d":2,"q":"The flow chart shows a reflex arc. What is the structure labelled A?","o":["Motor neurone","Effector","Receptor","Sensory neurone"],"a":3,"why":"Impulses pass from the receptor along the sensory neurone to the relay neurone in the spinal cord, then along the motor neurone to the effector.","dg":{"t":"flow","steps":["Stimulus","Receptor","A","Relay neurone","Motor neurone","Effector","Response"],"cycle":false}},{"s":"Biology","t":"Nervous system and sense organs","d":1,"q":"Which part of the eye controls the amount of light entering it?","o":["Cornea","Iris","Retina","Optic nerve"],"a":1,"why":"The iris changes the size of the pupil: it makes it smaller in bright light and larger in dim light."},{"s":"Biology","t":"Support and movement","d":1,"q":"Which structure joins a muscle to a bone?","o":["Ligament","Tendon","Cartilage","Synovial fluid"],"a":1,"why":"Tendons are tough inelastic cords joining muscle to bone; ligaments join bone to bone."},{"s":"Biology","t":"Reproduction","d":2,"q":"In the diagram of a flower, which labelled part receives pollen grains during pollination?","o":["B","C","D","A"],"a":3,"why":"A is the stigma, which is sticky and receives pollen. B is an anther, C the ovary and D a petal.","dg":{"t":"svg","svg":"<svg viewBox=\"0 0 300 200\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"150\" y1=\"190\" x2=\"150\" y2=\"126\"/><line x1=\"150\" y1=\"94\" x2=\"150\" y2=\"50\"/><line x1=\"142\" y1=\"100\" x2=\"115\" y2=\"62\"/><line x1=\"158\" y1=\"100\" x2=\"185\" y2=\"62\"/></g><g fill=\"currentColor\" fill-opacity=\"0.2\" stroke=\"currentColor\"><ellipse cx=\"150\" cy=\"110\" rx=\"14\" ry=\"16\"/><circle cx=\"150\" cy=\"44\" r=\"7\"/><ellipse cx=\"113\" cy=\"56\" rx=\"5\" ry=\"8\"/><ellipse cx=\"187\" cy=\"56\" rx=\"5\" ry=\"8\"/><ellipse cx=\"105\" cy=\"115\" rx=\"28\" ry=\"9\" transform=\"rotate(-25 105 115)\"/><ellipse cx=\"195\" cy=\"115\" rx=\"28\" ry=\"9\" transform=\"rotate(25 195 115)\"/></g><g stroke=\"currentColor\"><line x1=\"157\" y1=\"44\" x2=\"225\" y2=\"44\"/><line x1=\"193\" y1=\"56\" x2=\"225\" y2=\"72\"/><line x1=\"164\" y1=\"110\" x2=\"225\" y2=\"100\"/><line x1=\"214\" y1=\"126\" x2=\"225\" y2=\"146\"/></g><g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\"><text x=\"232\" y=\"48\">A</text><text x=\"232\" y=\"76\">B</text><text x=\"232\" y=\"104\">C</text><text x=\"232\" y=\"150\">D</text></g></svg>"}},{"s":"Biology","t":"Genetics","d":2,"q":"Two heterozygous tall pea plants (Tt) are crossed and produce 80 offspring. How many short plants are expected?","o":["20","10","40","60"],"a":0,"why":"Tt x Tt gives TT : Tt : Tt : tt, so 1/4 are short (tt). 1/4 of 80 = 20."},{"s":"Biology","t":"Genetics","d":3,"q":"In a cross between two plants of genotype RrYy (R = round, Y = yellow, both dominant), how many of 160 offspring are expected to be round and yellow?","o":["30","60","90","120"],"a":2,"why":"A dihybrid cross gives a 9:3:3:1 ratio, so 9/16 are round and yellow. 9/16 x 160 = 90."},{"s":"Biology","t":"Genetics","d":3,"q":"Colour blindness is X-linked recessive. A carrier woman marries a man with normal vision. What proportion of all their children are expected to be colour-blind sons?","o":["1/2","1/8","3/4","1/4"],"a":3,"why":"XCXc x XCY gives XCXC, XCXc, XCY and XcY. Only XcY (1 of 4 children) is a colour-blind son."},{"s":"Biology","t":"Evolution","d":2,"q":"In an industrial area where tree trunks were blackened by soot, dark peppered moths became more common than light ones. The best explanation is that","o":["light moths changed their colour to dark during their lifetime","dark moths were better camouflaged, so more survived predation and reproduced","soot caused all moths to mutate into dark forms","dark moths migrated from rural areas only"],"a":1,"why":"This is natural selection: individuals with a favourable variation survive and pass on their genes. Acquired characters are not inherited."},{"s":"Biology","t":"Ecology","d":2,"q":"In the food chain, which organism is the tertiary consumer?","o":["Toad","Grasshopper","Snake","Hawk"],"a":2,"why":"Grasshopper is the primary consumer, toad the secondary, snake the tertiary and hawk the quaternary consumer.","dg":{"t":"flow","steps":["Grass","Grasshopper","Toad","Snake","Hawk"],"cycle":false}},{"s":"Biology","t":"Ecology","d":2,"q":"The chart shows energy at three trophic levels. What percentage of the energy in primary consumers is passed to secondary consumers?","o":["10%","1%","50%","90%"],"a":0,"why":"2000 kJ falls to 200 kJ, so 200 / 2000 x 100 = 10%. Most energy is lost as heat, movement and waste.","dg":{"t":"bar","title":"Energy at each trophic level","x":["Producers","Primary consumers","Secondary consumers"],"y":[20000,2000,200],"unit":"kJ"}},{"s":"Biology","t":"Soil, habitats and the environment","d":2,"q":"The pie chart shows the composition of a fertile soil by volume. What percentage of the soil volume is pore space (air plus water)?","o":["25%","45%","50%","75%"],"a":2,"why":"Air 25% + water 25% = 50%. The rest is mineral particles (45%) and organic matter (5%).","dg":{"t":"pie","labels":["Mineral particles","Air","Water","Organic matter"],"vals":[45,25,25,5]}},{"s":"Biology","t":"Pests, disease and public health","d":1,"q":"Malaria is transmitted to humans by the bite of the","o":["female Anopheles mosquito","female Aedes mosquito","tsetse fly","housefly"],"a":0,"why":"The malaria parasite (Plasmodium) is carried by the female Anopheles mosquito. Aedes spreads yellow fever and the tsetse fly spreads sleeping sickness."},{"s":"Biology","t":"Adaptation and adaptive colouration","d":2,"q":"The bright black and orange markings on a poisonous caterpillar are an example of","o":["camouflage","countershading","disruptive colouration","warning colouration"],"a":3,"why":"Bright conspicuous colours advertise that the animal is distasteful or poisonous, so predators learn to avoid it."},{"s":"Biology","t":"Symbiosis and nutrient cycling","d":2,"q":"In the nitrogen cycle shown, which process is labelled A, in which Nitrosomonas and Nitrobacter change ammonium compounds into nitrates?","o":["Denitrification","Nitrification","Nitrogen fixation","Ammonification"],"a":1,"why":"Nitrifying bacteria oxidise ammonium to nitrite and then nitrate, which plants absorb. Ammonification is the earlier decay step.","dg":{"t":"flow","steps":["Dead organisms and waste","Ammonium compounds","A","Nitrates in soil","Plants","Animals"],"cycle":true}},{"s":"Biology","t":"Symbiosis and nutrient cycling","d":1,"q":"A tapeworm living in the intestine of a human is an example of","o":["mutualism","parasitism","commensalism","saprophytism"],"a":1,"why":"The tapeworm gains food and shelter and harms the host, which is parasitism."},{"s":"Biology","t":"Nigerian biomes and ecological succession","d":2,"q":"On a bare rock surface, the first organisms to colonise (the pioneer species) are usually","o":["tall forest trees","shrubs","climax forest species","lichens"],"a":3,"why":"Lichens can grow on bare rock and help to form the first soil, beginning ecological succession."},{"s":"Biology","t":"Variety of organisms (levels of organisation / animal","d":1,"q":"In the levels of organisation shown, which level is labelled A?","o":["Organ","Organelle","Population","Community"],"a":0,"why":"Cells form tissues, tissues form organs (A), organs form organ systems, and systems form the organism.","dg":{"t":"flow","steps":["Cell","Tissue","A","Organ system","Organism"],"cycle":false}},{"s":"Biology","t":"Variation in Population","d":2,"q":"The bar chart shows the heights of 100 students. What type of variation does it show?","o":["Discontinuous variation, because students fall into clearly separate groups","Discontinuous variation, because height is controlled by a single gene pair","Continuous variation, because heights fall along a smooth range with most near the average","No variation, because most students are of average height"],"a":2,"why":"Height can take any value within a range and gives a bell-shaped distribution, which is continuous variation. Blood group is an example of discontinuous variation.","dg":{"t":"bar","title":"Heights of 100 students","x":["140-149","150-159","160-169","170-179","180-189"],"y":[5,20,45,25,5],"unit":"students"}},{"s":"Biology","t":"Microorganisms: Man and health","d":2,"q":"Which of these diseases is caused by a virus?","o":["Tuberculosis","Typhoid fever","Malaria","Measles"],"a":3,"why":"Measles is viral. Tuberculosis and typhoid are bacterial, and malaria is caused by a protozoan."},{"s":"Biology","t":"Conservation of Natural Resources","d":1,"q":"Which of these is a game reserve in Bauchi State, Nigeria?","o":["Kainji Lake National Park","Yankari Game Reserve","Old Oyo National Park","Cross River National Park"],"a":1,"why":"Yankari Game Reserve is in Bauchi State. The others are in Niger/Kwara, Oyo and Cross River States respectively."},{"s":"Biology","t":"Ecology","d":3,"q":"In a capture-recapture study, 50 fish were caught, marked and released. A later sample of 40 fish contained 10 marked ones. What is the estimated population size?","o":["125","160","200","500"],"a":2,"why":"Population = (first sample x second sample) / marked recaptured = 50 x 40 / 10 = 200."},{"s":"Geography","t":"Introduction to geography","d":2,"q":"When it is 6:00 a.m. GMT, what is the local time at longitude 60 degrees East?","o":["10:00 a.m.","2:00 a.m.","9:00 a.m.","11:00 a.m."],"a":0,"why":"The earth rotates 15 degrees per hour, so 60 degrees is 4 hours. East is ahead of GMT: 6:00 + 4 hours = 10:00 a.m."},{"s":"Geography","t":"Rocks and landforms","d":2,"q":"In the flow chart of landscape change, what process is labelled A?","o":["Metamorphism","Compaction","Transportation","Vulcanicity"],"a":2,"why":"Weathered rock is eroded, carried away by water, wind or ice (transportation), and finally deposited.","dg":{"t":"flow","steps":["Weathering","Erosion","A","Deposition"],"cycle":false}},{"s":"Geography","t":"Rocks and landforms","d":2,"q":"A fan-shaped landform built where a river deposits its load at the sea, such as in southern Nigeria, is called a","o":["delta","gorge","waterfall","interlocking spur"],"a":0,"why":"The Niger Delta is a depositional landform formed where the river slows and drops sediment at its mouth."},{"s":"Geography","t":"Weather and climate","d":2,"q":"The bar chart shows monthly rainfall at a station in southern Nigeria. What is the total annual rainfall?","o":["1625 mm","1825 mm","1575 mm","1725 mm"],"a":3,"why":"5+10+60+120+200+280+310+290+260+150+30+10 = 1725 mm.","dg":{"t":"bar","title":"Monthly rainfall","x":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],"y":[5,10,60,120,200,280,310,290,260,150,30,10],"unit":"mm"}},{"s":"Geography","t":"Weather and climate","d":1,"q":"In the water cycle shown, what is the process labelled A?","o":["Transpiration","Precipitation","Evaporation","Sublimation"],"a":1,"why":"Condensed water in clouds falls as rain, hail or snow, which is precipitation.","dg":{"t":"flow","steps":["Evaporation","Condensation","A","Runoff and infiltration"],"cycle":true}},{"s":"Geography","t":"Weather and climate","d":2,"q":"The bar chart shows the annual rainfall of four stations. Which station, having the lowest rainfall, most likely lies in the driest vegetation belt (the Sahel savanna)?","o":["Calabar","Maiduguri","Ibadan","Kano"],"a":1,"why":"Maiduguri has the lowest rainfall (600 mm) and is in the far north-east. Calabar is in the rainforest and Ibadan in the forest-savanna zone.","dg":{"t":"bar","title":"Annual rainfall of four stations","x":["Calabar","Ibadan","Kano","Maiduguri"],"y":[3000,1500,800,600],"unit":"mm"}},{"s":"Geography","t":"Population","d":2,"q":"A region has an area of 50,000 square km and a population of 4.5 million. What is its population density?","o":["9 persons per sq km","225 persons per sq km","900 persons per sq km","90 persons per sq km"],"a":3,"why":"Density = population / area = 4,500,000 / 50,000 = 90 persons per square km."},{"s":"Geography","t":"Population","d":3,"q":"The pie chart shows the age structure of a country. The dependency ratio (dependants per 100 working-age people) is about","o":["89","47","53","113"],"a":0,"why":"Dependants are 0-14 plus 65 and above = 44 + 3 = 47. Ratio = 47 / 53 x 100 = about 89.","dg":{"t":"pie","labels":["0-14 years","15-64 years","65 years and above"],"vals":[44,53,3]}},{"s":"Geography","t":"Population","d":2,"q":"The graph shows the population of Country P. What was the percentage increase between 2010 and 2020?","o":["20%","30%","40%","60%"],"a":2,"why":"Increase = 210 - 150 = 60 million. 60 / 150 x 100 = 40%.","dg":{"t":"line","title":"Population of Country P","x":["1990","2000","2010","2020"],"y":[100,120,150,210],"unit":"millions"}},{"s":"Geography","t":"Natural resources and agriculture","d":1,"q":"Cocoa is grown mainly in which part of Nigeria?","o":["North-East","North-West","Lake Chad basin","South-West"],"a":3,"why":"Cocoa needs a hot, wet climate with well-distributed rainfall, found in the forest belt of Ondo, Ogun, Oyo and Osun States."},{"s":"Geography","t":"Practical geography","d":2,"q":"On a map of scale 1:50,000, two towns are 4 cm apart. What is the actual distance between them?","o":["0.8 km","2 km","20 km","200 km"],"a":1,"why":"4 cm x 50,000 = 200,000 cm = 2,000 m = 2 km."},{"s":"Geography","t":"Economic geography","d":2,"q":"The pie chart shows the exports of a country. What angle represents crude oil?","o":["85 degrees","255 degrees","306 degrees","270 degrees"],"a":2,"why":"Angle = 85 / 100 x 360 = 306 degrees.","dg":{"t":"pie","labels":["Crude oil","Cocoa","Other products"],"vals":[85,5,10]}},{"s":"Geography","t":"Environmental issues","d":2,"q":"Which measure is most effective in checking desertification in northern Nigeria?","o":["Planting shelterbelts of trees","Overgrazing the pasture","Clearing forests for fuelwood","Annual bush burning"],"a":0,"why":"Rows of trees reduce wind speed and soil erosion and hold moisture. The other choices expose and degrade the soil."},{"s":"Geography","t":"Elementary surveying","d":2,"q":"What is the bearing of point B from point A in the diagram?","o":["135 degrees","225 degrees","045 degrees","315 degrees"],"a":2,"why":"B lies equally far north and east of A, so it is half-way between north and east: 045 degrees measured clockwise from north.","dg":{"t":"svg","svg":"<svg viewBox=\"0 0 300 200\"><g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><line x1=\"40\" y1=\"160\" x2=\"40\" y2=\"100\"/><line x1=\"120\" y1=\"140\" x2=\"180\" y2=\"80\"/></g><polygon points=\"40,92 34,106 46,106\" fill=\"currentColor\"/><line x1=\"120\" y1=\"140\" x2=\"120\" y2=\"60\" stroke=\"currentColor\" stroke-dasharray=\"4\"/><circle cx=\"120\" cy=\"140\" r=\"4\" fill=\"currentColor\"/><circle cx=\"180\" cy=\"80\" r=\"4\" fill=\"currentColor\"/><g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\"><text x=\"34\" y=\"86\">N</text><text x=\"104\" y=\"158\">A</text><text x=\"188\" y=\"78\">B</text><text x=\"112\" y=\"54\">N</text></g></svg>"}},{"s":"Geography","t":"Volcanism and earthquakes","d":1,"q":"The point on the earth's surface directly above the focus of an earthquake is the","o":["epicentre","hypocentre","fault","crater"],"a":0,"why":"The focus is the point underground where the rock breaks; the epicentre is directly above it and usually has the strongest shaking."},{"s":"Geography","t":"Water bodies","d":2,"q":"Which cold ocean current along the south-west coast of Africa contributes to the dryness of the Namib Desert?","o":["Guinea current","Mozambique current","Agulhas current","Benguela current"],"a":3,"why":"The cold Benguela current cools the air, reduces evaporation and rainfall on the coast. Guinea, Mozambique and Agulhas currents are warm."},{"s":"Geography","t":"Environmental resources, interaction, hazards and","d":2,"q":"A hazard triggered mainly by heavy rainfall on steep slopes with loose soil is a","o":["volcanic eruption","landslide","drought","tsunami"],"a":1,"why":"Water adds weight and reduces friction between soil layers, so loose material slides downhill."},{"s":"Geography","t":"ECOWAS","d":1,"q":"The Economic Community of West African States (ECOWAS) was established in the year","o":["1960","1975","1963","1991"],"a":1,"why":"ECOWAS was formed by the Treaty of Lagos in 1975; its headquarters is in Abuja."},{"s":"Geography","t":"Statistical maps and diagrams","d":2,"q":"The pie chart shows land use on a farm settlement. What angle represents forest?","o":["25 degrees","60 degrees","120 degrees","90 degrees"],"a":3,"why":"25% of 360 degrees = 90 degrees.","dg":{"t":"pie","labels":["Cropland","Forest","Pasture","Built-up"],"vals":[40,25,20,15]}},{"s":"Geography","t":"Tectonic processes","d":2,"q":"New crust is formed where plates move apart. This type of plate boundary is called","o":["divergent","convergent","transform","subduction"],"a":0,"why":"At divergent boundaries such as the Mid-Atlantic Ridge magma rises and cools to form new oceanic crust."},{"s":"Geography","t":"Climate classification and climate change","d":2,"q":"The line graph shows mean monthly temperatures of a town. What is the annual range of temperature?","o":["7 degrees C","11 degrees C","9 degrees C","31 degrees C"],"a":2,"why":"Highest (April) 31 minus lowest (January and December) 22 = 9 degrees C.","dg":{"t":"line","title":"Mean monthly temperature","x":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],"y":[22,25,29,31,30,28,26,25,26,28,25,22],"unit":"degrees C"}},{"s":"Geography","t":"Tourism","d":1,"q":"The Obudu Mountain Resort is located in","o":["Kano State","Sokoto State","Lagos State","Cross River State"],"a":3,"why":"Obudu is on the Obudu Plateau in Cross River State and is famous for its cool climate."},{"s":"Geogr
