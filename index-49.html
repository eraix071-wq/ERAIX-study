aphy","t":"Communication (Nigeria)","d":2,"q":"Which means of transport is cheapest for moving very bulky goods over long distances?","o":["Air transport","Water transport","Road transport","Head porterage"],"a":1,"why":"Ships and barges carry huge loads at low cost per tonne, although they are slow."},{"s":"Geography","t":"Geopolitical issues: land reclamation","d":2,"q":"Which of these projects is an example of land reclamation in Nigeria?","o":["Kainji Dam","Ajaokuta Steel Plant","Eko Atlantic City, Lagos","Third Mainland Bridge"],"a":2,"why":"Eko Atlantic City is being built on land created from the Atlantic Ocean by sand-filling."},{"s":"Agricultural Science","t":"Soil science","d":1,"q":"Which of these is commonly applied to correct soil acidity?","o":["Lime","Ammonium sulphate","Sulphur","Sawdust"],"a":0,"why":"Lime (calcium carbonate or oxide) neutralises acids and raises soil pH; sulphur and ammonium sulphate make soil more acidic."},{"s":"Agricultural Science","t":"Soil science","d":2,"q":"Which soil has large particles, drains quickly and holds little water?","o":["Clay soil","Loamy soil","Sandy soil","Silty soil"],"a":2,"why":"Sand has large particles and big pore spaces, so water drains fast. Clay holds the most water."},{"s":"Agricultural Science","t":"Crop production","d":2,"q":"In a rotation maize, yam, A, cassava, which crop is the best choice for A to restore soil nitrogen?","o":["Cowpea","Sorghum","Sugarcane","Rice"],"a":0,"why":"Cowpea is a legume with nitrogen-fixing Rhizobium bacteria in its root nodules.","dg":{"t":"flow","steps":["Maize","Yam","A","Cassava"],"cycle":true}},{"s":"Agricultural Science","t":"Animal production","d":1,"q":"Which of these farm animals is a ruminant?","o":["Pig","Rabbit","Chicken","Goat"],"a":3,"why":"Goats chew the cud and have a four-chambered stomach. Pigs, rabbits and chickens are not ruminants."},{"s":"Agricultural Science","t":"Farm tools and machinery","d":1,"q":"Which of these implements is used for primary tillage?","o":["Harrow","Plough","Knapsack sprayer","Rake"],"a":1,"why":"The plough breaks and turns the soil first. Harrowing is secondary tillage."},{"s":"Agricultural Science","t":"Pests and diseases","d":2,"q":"Newcastle disease is a viral disease that mainly affects","o":["cattle","poultry","sheep","pigs"],"a":1,"why":"Newcastle disease causes respiratory signs, twisted necks and heavy deaths in chickens; it is controlled by vaccination."},{"s":"Agricultural Science","t":"Agricultural economics","d":2,"q":"A farmer sells 400 bags of maize at N15,000 per bag. His total cost of production was N4,000,000. What is his net profit?","o":["N4,000,000","N6,000,000","N10,000,000","N2,000,000"],"a":3,"why":"Revenue = 400 x 15,000 = N6,000,000. Profit = 6,000,000 - 4,000,000 = N2,000,000."},{"s":"Agricultural Science","t":"Forestry and fisheries","d":2,"q":"In the taungya system, farmers","o":["grow food crops between young forest tree seedlings","only graze animals in forest reserves","harvest mature trees for timber","burn the forest to create ranches"],"a":0,"why":"The farmers weed and tend the seedlings while growing crops, until the tree canopy closes."},{"s":"Agricultural Science","t":"Genetics and breeding","d":2,"q":"The increase in vigour of the offspring over both parents, obtained by crossing unrelated lines, is called","o":["inbreeding depression","mutation","hybrid vigour","selection"],"a":2,"why":"Hybrid vigour (heterosis) arises from crossing genetically different parents, as in hybrid maize."},{"s":"Agricultural Science","t":"Land and Land Use","d":2,"q":"Under the communal land tenure system, land belongs to","o":["the government only","an individual farmer","a company","the family or community"],"a":3,"why":"Under communal tenure land is held by the family or community and allocated to members for use."},{"s":"Agricultural Science","t":"Water Management","d":2,"q":"In a drip irrigation system, which part is labelled A?","o":["Reservoir","Lateral pipes","Pump","Emitters"],"a":1,"why":"The main pipe feeds lateral pipes, which carry water along crop rows to the emitters at the plant roots.","dg":{"t":"flow","steps":["Reservoir","Pump","Main pipe","A","Emitters"],"cycle":false}},{"s":"Agricultural Science","t":"Farm Surveying and Planning","d":2,"q":"A rectangular plot is 120 m by 80 m. What is its area in hectares?","o":["0.096","9.6","0.96","96"],"a":2,"why":"Area = 120 x 80 = 9,600 square m. One hectare = 10,000 square m, so 9,600 / 10,000 = 0.96 ha."},{"s":"Agricultural Science","t":"Livestock Management and Nutrition","d":2,"q":"The pie chart shows a poultry ration. Which ingredient mainly supplies energy?","o":["Maize","Groundnut cake","Fish meal","Bone meal and oyster shell"],"a":0,"why":"Maize is rich in carbohydrate and makes up 60% of the ration. Groundnut cake and fish meal supply protein, and bone meal supplies minerals.","dg":{"t":"pie","labels":["Maize","Groundnut cake","Fish meal","Bone meal and oyster shell"],"vals":[60,25,10,5]}},{"s":"Agricultural Science","t":"Agricultural Finance, Marketing and Extension","d":2,"q":"The bar chart is from a farmer's sales record. What was the total sale from January to April?","o":["N95,000","N100,000","N110,000","N120,000"],"a":2,"why":"20 + 35 + 15 + 40 = 110 thousand naira.","dg":{"t":"bar","title":"Monthly sales","x":["Jan","Feb","Mar","Apr"],"y":[20,35,15,40],"unit":"N thousand"}},{"s":"Agricultural Science","t":"Farm Surveying and Planning","d":2,"q":"The pie chart shows how a 10-hectare farm is used. What percentage of the farm is under cassava?","o":["30%","20%","25%","40%"],"a":0,"why":"Cassava occupies 3 ha out of 10 ha, so 3 / 10 x 100 = 30%.","dg":{"t":"pie","labels":["Maize","Cassava","Yam","Fallow"],"vals":[4,3,2,1]}},{"s":"English","t":"Grammar","d":1,"q":"Each of the students ___ a copy of the syllabus.","o":["were","have","has","are having"],"a":2,"why":"'Each' is singular and takes a singular verb, so 'has' is correct."},{"s":"English","t":"Vocabulary","d":2,"q":"Choose the word nearest in meaning to the underlined word: The principal's decision was IRREVOCABLE.","o":["unfair","delayed","popular","cannot be changed"],"a":3,"why":"'Irrevocable' means impossible to cancel or reverse, i.e. it cannot be changed."},{"s":"English","t":"Vocabulary","d":2,"q":"Choose the word opposite in meaning to FRUGAL.","o":["thrifty","extravagant","economical","careful"],"a":1,"why":"'Frugal' means sparing with money; its opposite is 'extravagant' (wasteful with money)."},{"s":"English","t":"Lexis and structure","d":2,"q":"She is allergic ___ groundnut oil.","o":["at","against","to","with"],"a":2,"why":"The adjective 'allergic' is followed by the preposition 'to'."},{"s":"English","t":"Lexis and structure","d":2,"q":"Had I known about the strike, I ___ stayed at home.","o":["would","would have","will have","had"],"a":1,"why":"This is a third conditional (Had + past participle ... would have + past participle), so 'would have stayed' is correct."},{"s":"English","t":"Oral English","d":1,"q":"Which of the following words has the main stress on the SECOND syllable?","o":["answer","market","perform","garden"],"a":2,"why":"'Garden', 'answer' and 'market' are stressed on the first syllable; 'perform' is stressed on the second (per-FORM)."},{"s":"English","t":"Oral English","d":1,"q":"Choose the word that has the same vowel sound as the one in 'food'.","o":["good","cord","blood","blue"],"a":3,"why":"'Food' and 'blue' share the long /u:/ sound. 'Good' has a short vowel, 'blood' has /ʌ/ and 'cord' has /ɔ:/."},{"s":"English","t":"Oral English","d":1,"q":"Which of these words contains a silent letter 'b'?","o":["bring","climb","rabbit","table"],"a":1,"why":"In 'climb' the final b is not pronounced. In the other words the b is sounded."},{"s":"English","t":"Oral forms: intonation/emphatic stress","d":2,"q":"In the sentence 'Ade bought a RED car', the capitalised word carries emphatic stress. This most likely shows that","o":["Ade rather than somebody else bought the car","the car was bought and not borrowed","the colour red is being contrasted with other colours","the speaker is asking a question"],"a":2,"why":"Emphatic stress falls on the word being contrasted or corrected; here it is the colour of the car."},{"s":"English","t":"Oral forms: intonation/emphatic stress","d":2,"q":"On which of these sentences would a speaker most typically use a rising intonation at the end?","o":["Close the door.","How old are you?","She lives in Enugu.","Is she living in Enugu?"],"a":3,"why":"Yes/no questions normally end with a rising tone; statements, commands and wh-questions usually fall."},{"s":"English","t":"Advanced grammar and usage","d":3,"q":"Not only ___ the examination, but he also won a prize.","o":["passed he","did he pass","he passed","he did pass"],"a":1,"why":"When a sentence begins with 'Not only', subject-auxiliary inversion is needed: 'did he pass'."},{"s":"English","t":"Figurative usage and structural elements in lexis","d":1,"q":"'The classroom was a beehive of activity.' The expression is an example of","o":["hyperbole","simile","irony","metaphor"],"a":3,"why":"The classroom is directly said to be a beehive, with no 'like' or 'as', so it is a metaphor."},{"s":"English","t":"Figurative usage and structural elements in lexis","d":2,"q":"'The wind whispered through the corn.' The figure of speech used is","o":["oxymoron","apostrophe","personification","onomatopoeia"],"a":2,"why":"Giving the human action of whispering to the wind is personification."},{"s":"English","t":"Figurative usage and structural elements in lexis","d":2,"q":"The idiom 'to bite the bullet' means","o":["to make a hasty decision","to refuse an offer","to endure something unpleasant bravely","to attack someone"],"a":2,"why":"To 'bite the bullet' is to face a painful or difficult situation with courage."},{"s":"English","t":"Structure: word forms and structural words","d":2,"q":"She spoke ___ than anyone else in the debate.","o":["most eloquent","eloquently","more eloquent","more eloquently"],"a":3,"why":"An adverb is needed to modify 'spoke', and the comparative with 'than' is 'more eloquently'."},{"s":"English","t":"Structure: word forms and structural words","d":2,"q":"The man ___ car was stolen reported the matter to the police.","o":["whose","who","whom","which"],"a":0,"why":"'Whose' shows possession (the man's car)."},{"s":"English","t":"Lexis and structure","d":1,"q":"In the sentence 'We sat on the bank of the River Niger', the word 'bank' means","o":["the land alongside a river","to tilt an aircraft","a place where money is kept","a row of switches"],"a":0,"why":"The context of a river shows that 'bank' means the sloping land at the river's edge."},{"s":"English","t":"Lexis and structure","d":3,"q":"'Only Bola eats rice on Sundays.' This sentence means that","o":["Bola does not eat rice on weekdays","nobody except Bola eats rice on Sundays","Bola eats nothing but rice on Sundays","Bola eats rice on Sundays and no other day"],"a":1,"why":"'Only' placed before 'Bola' limits the action to Bola alone: no one else eats rice on Sundays."},{"s":"English","t":"Vocabulary","d":1,"q":"In law, the person who brings a case against another in court is called the","o":["juror","plaintiff","bailiff","defendant"],"a":1,"why":"The plaintiff starts the case; the defendant is the person sued or accused."},{"s":"English","t":"Vocabulary","d":1,"q":"A doctor who specialises in the treatment of children is a","o":["obstetrician","cardiologist","dermatologist","paediatrician"],"a":3,"why":"Paediatrics is the branch of medicine for children."},{"s":"English","t":"Vocabulary","d":3,"q":"Choose the word nearest in meaning to EPHEMERAL.","o":["short-lived","harmful","ancient","important"],"a":0,"why":"'Ephemeral' describes something that lasts only a very short time."},{"s":"English","t":"Comprehension","d":2,"q":"Read: 'Mama Chidi rose before dawn every market day. She arranged her tomatoes in neat pyramids, though she knew the first customers would scatter them within minutes. \"A tidy stall,\" she liked to say, \"tells the buyer that the seller respects her own goods.\"' Mama Chidi's remark suggests that she believes","o":["customers prefer cheap tomatoes","neat presentation reflects pride in what one sells","buyers should arrange the goods themselves","early rising brings more profit"],"a":1,"why":"Her saying links a tidy stall with the seller's respect for her goods, i.e. pride in her trade."},{"s":"English","t":"Essay and letter writing","d":1,"q":"A formal letter begins with 'Dear Sir'. The correct complimentary close is","o":["Your friend","Yours sincerely","Yours lovingly","Yours faithfully"],"a":3,"why":"When the recipient is addressed as 'Sir/Madam' without a name, the formal close is 'Yours faithfully'."},{"s":"English","t":"Summary writing","d":2,"q":"The best way to write a good summary of a passage is to","o":["include every example given by the writer","pick out the main points and restate them briefly in your own words","add your own opinions on the topic","copy the first paragraph word for word"],"a":1,"why":"A summary is a concise statement of the main ideas in your own words, without examples or personal views."},{"s":"English","t":"Speech writing and reports","d":1,"q":"A speech to be delivered at a school assembly should normally begin with","o":["a list of references","a formal salutation to the audience","the conclusion","the speaker's signature"],"a":1,"why":"Speeches open by greeting the audience formally, e.g. 'The Principal, teachers and fellow students'."},{"s":"Economics","t":"Basic economic concepts","d":1,"q":"A student skips a paid weekend job to prepare for an examination. The opportunity cost of studying is","o":["the time spent travelling","the examination fee","the cost of textbooks","the wages forgone from the job"],"a":3,"why":"Opportunity cost is the value of the next best alternative given up, here the wages from the job."},{"s":"Economics","t":"Demand and supply","d":1,"q":"The graph shows quantity demanded of exercise books at different prices. The data illustrate","o":["the law of demand","the law of supply","a Giffen good","the law of diminishing returns"],"a":0,"why":"Quantity demanded falls from 80 to 20 as price rises from N100 to N400: the law of demand.","dg":{"t":"line","title":"Quantity demanded of exercise books","x":["N100","N200","N300","N400"],"y":[80,60,40,20],"unit":"units"}},{"s":"Economics","t":"Demand and supply","d":2,"q":"A rise in the price of rice, a substitute for yam, will cause the demand for yam to","o":["increase","decrease","remain unchanged","become perfectly inelastic"],"a":0,"why":"Consumers switch from the dearer substitute (rice) to yam, so the demand for yam rises."},{"s":"Economics","t":"Demand and supply","d":2,"q":"Demand is given by Qd = 100 - 2P and supply by Qs = 20 + 2P. The equilibrium price and quantity are respectively","o":["15 and 70","30 and 40","25 and 50","20 and 60"],"a":3,"why":"Set Qd = Qs: 100 - 2P = 20 + 2P gives P = 20; then Q = 100 - 40 = 60."},{"s":"Economics","t":"Demand and supply","d":1,"q":"The graph shows quantity supplied of a good. When the price rises from N100 to N200, quantity supplied","o":["halves","doubles","remains constant","falls by 20 units"],"a":1,"why":"Quantity supplied rises from 20 to 40 units, which is a doubling, consistent with the law of supply.","dg":{"t":"line","title":"Quantity supplied","x":["N50","N100","N150","N200"],"y":[10,20,30,40],"unit":"units"}},{"s":"Economics","t":"Elasticity","d":2,"q":"When the price of a good rises from N20 to N25, quantity demanded falls from 100 to 80 units. Using the original values, the price elasticity of demand is","o":["1.0","1.25","0.2","0.8"],"a":3,"why":"%change in Q = 20/100 = 20%; %change in P = 5/20 = 25%. PED = 20/25 = 0.8, so demand is inelastic."},{"s":"Economics","t":"Elasticity","d":2,"q":"When a consumer's income rises by 20%, quantity demanded of a good rises by 10%. The income elasticity of demand is 0.5, so the good is","o":["a normal good","a Giffen good","an inferior good","a perfect substitute"],"a":0,"why":"YED = 10/20 = 0.5, which is positive, so demand rises with income: a normal good."},{"s":"Economics","t":"Production","d":1,"q":"In the chain shown, garri processing is an example of which stage of production?","o":["consumption","primary production","secondary production","tertiary production"],"a":2,"why":"Converting cassava (raw material) into garri is manufacturing, i.e. secondary production.","dg":{"t":"flow","steps":["Cassava farming","Garri processing","Garri sold in market"],"cycle":false}},{"s":"Economics","t":"Distribution and national income","d":2,"q":"In the simple circular flow shown, firms make payments to households in the form of","o":["taxes and subsidies","loans from the central bank","wages, rent, interest and profit","import duties"],"a":2,"why":"Households supply factors of production; firms pay them factor incomes: wages, rent, interest and profit.","dg":{"t":"flow","steps":["Households supply labour and land","Firms pay factor incomes","Households buy goods","Firms supply goods"],"cycle":true}},{"s":"Economics","t":"Theory of the firm","d":2,"q":"The bar chart shows total cost (in N'000) at different outputs. The marginal cost of the 4th unit is","o":["N130,000","N32,500","N30,000","N50,000"],"a":2,"why":"Marginal cost = TC(4) - TC(3) = 130 - 100 = N30 thousand.","dg":{"t":"bar","title":"Total cost (N'000) by output","x":["1","2","3","4","5"],"y":[50,80,100,130,180],"unit":"N'000"}},{"s":"Economics","t":"Theory of the firm","d":2,"q":"A firm produces 400 units at a total cost of N60,000, of which N20,000 is fixed cost. Its average variable cost is","o":["N150","N40","N100","N50"],"a":2,"why":"Variable cost = 60,000 - 20,000 = 40,000; AVC = 40,000 / 400 = N100."},{"s":"Economics","t":"Distribution and national income","d":2,"q":"In an open economy: C = N500m, I = N200m, G = N300m, X = N150m and M = N100m. GDP by the expenditure method is","o":["N1,050m","N950m","N1,150m","N1,250m"],"a":0,"why":"GDP = C + I + G + (X - M) = 500 + 200 + 300 + 50 = N1,050m."},{"s":"Economics","t":"Distribution and national income","d":3,"q":"GDP is N900bn, net income from abroad is -N40bn and depreciation is N60bn. Net National Product is","o":["N840bn","N860bn","N1,000bn","N800bn"],"a":3,"why":"GNP = 900 - 40 = 860; NNP = GNP - depreciation = 860 - 60 = N800bn."},{"s":"Economics","t":"Money and banking","d":1,"q":"Which of the following is NOT a function of money?","o":["Factor of production","Medium of exchange","Store of value","Unit of account"],"a":0,"why":"Money serves as medium of exchange, store of value and unit of account; it is not itself a factor of production."},{"s":"Economics","t":"Money and banking","d":1,"q":"The Central Bank of Nigeria acts as lender of last resort to","o":["commercial banks","foreign governments","cooperative societies","households"],"a":0,"why":"As the bankers' bank, the CBN lends to commercial banks facing shortage of cash."},{"s":"Economics","t":"Public finance","d":1,"q":"A tax system in which the tax rate increases as income increases is said to be","o":["progressive","proportional","regressive","indirect"],"a":0,"why":"Progressive taxes take a higher percentage from higher incomes."},{"s":"Economics","t":"Public finance","d":2,"q":"The pie chart shows the budget shares of a government with a total budget of N2 trillion. The amount for Education is","o":["N300 billion","N500 billion","N600 billion","N400 billion"],"a":2,"why":"Education share is 30% of N2 trillion = 0.3 x 2,000bn = N600 billion.","dg":{"t":"pie","labels":["Education","Health","Defence","Works"],"vals":[30,20,25,25]}},{"s":"Economics","t":"International trade","d":3,"q":"In one day Ghana can produce 6 units of cocoa or 12 units of cloth; Nigeria can produce 4 units of cocoa or 4 units of cloth. Which statement is correct?","o":["Nigeria has an absolute advantage in both goods","Ghana has a comparative advantage in cocoa","Nigeria has a comparative advantage in cocoa","Nigeria has a comparative advantage in cloth"],"a":2,"why":"Opportunity cost of 1 cocoa: Ghana 2 cloth, Nigeria 1 cloth. Nigeria's is lower, so it has the comparative advantage in cocoa (Ghana in cloth)."},{"s":"Economics","t":"International trade","d":1,"q":"A country exports visible goods worth N900m and imports visible goods worth N1,100m. Its balance of trade is","o":["a deficit of N2,000m","a surplus of N900m","a deficit of N200m","a surplus of N200m"],"a":2,"why":"Balance of trade = 900 - 1,100 = -N200m, a deficit."},{"s":"Economics","t":"Economic development and planning","d":1,"q":"The Human Development Index measures a country's achievement in","o":["life expectancy, education and income","rainfall, soil and vegetation","tax, tariff and budget","exports, imports and tourism"],"a":0,"why":"HDI combines health (life expectancy), education and standard of living (income)."},{"s":"Economics","t":"Agriculture, industry and population","d":3,"q":"The pie chart shows the age structure of a country's population. The dependency ratio is approximately","o":["55%","45%","122%","82%"],"a":3,"why":"Dependants = 40 + 5 = 45; working-age = 55; ratio = 45/55 = about 82%.","dg":{"t":"pie","labels":["0-14 years","15-64 years","65 years and above"],"vals":[40,55,5]}},{"s":"Economics","t":"Economic integration and organisations","d":1,"q":"The Economic Community of West African States (ECOWAS) was established in","o":["1975","1960","1985","1963"],"a":0,"why":"ECOWAS was formed by the Treaty of Lagos in 1975."},{"s":"Economics","t":"Inflation and deflation","d":2,"q":"A basket of goods cost N20,000 last year and N23,000 this year. The rate of inflation is","o":["23%","15%","13%","3%"],"a":1,"why":"Inflation = (23,000 - 20,000)/20,000 x 100 = 15%."},{"s":"Economics","t":"Unemployment and factor theories","d":1,"q":"Farm workers who are jobless during the harmattan because no crops can be grown are suffering from","o":["seasonal unemployment","frictional unemployment","structural unemployment","cyclical unemployment"],"a":0,"why":"Unemployment that arises from the time of year is seasonal."},{"s":"Government","t":"Basic concepts of government","d":1,"q":"The legitimate right to exercise power is called","o":["authority","influence","force","coercion"],"a":0,"why":"Authority is power that is recognised as rightful by those governed."},{"s":"Government","t":"Basic concepts of government","d":1,"q":"The supreme power of a state to make and enforce laws within its territory is","o":["suffrage","federalism","legitimacy","sovereignty"],"a":3,"why":"Sovereignty is the ultimate authority of a state over its territory and people."},{"s":"Government","t":"Forms and systems of government","d":1,"q":"A feature of the presidential system of government is","o":["fusion of executive and legislature","a ceremonial president","collective responsibility of the cabinet","separation of powers"],"a":3,"why":"Presidential systems separate the executive, legislature and judiciary."},{"s":"Government","t":"Forms and systems of government","d":2,"q":"In a unitary system of government, political power is","o":["held by regional governments","concentrated in the central government","vested in the judiciary","shared equally among states"],"a":1,"why":"A unitary state has one supreme central government; lower units exist at its discretion."},{"s":"Government","t":"The constitution","d":2,"q":"A constitution that can be amended by the ordinary legislative process is described as","o":["written","federal","rigid","flexible"],"a":3,"why":"Flexible constitutions are changed as easily as ordinary laws; rigid ones need special procedures."},{"s":"Government","t":"The constitution","d":2,"q":"The constitution that first introduced the elective principle in Nigeria in 1922 was the","o":["Richards Constitution","Macpherson Constitution","Lyttleton Constitution","Cliffor ter the seller's quotation, the buyer places an order.","dg":{"t":"flow","steps":["Enquiry","Quotation","?","Invoice","Payment"],"cycle":false}},{"s":"Commerce","t":"Money and Stock Exchange","d":2,"q":"Holders of debentures in a company receive","o":["a fixed rate of interest","a variable dividend","voting rights","a share of profit"],"a":0,"why":"Debenture holders are creditors who receive fixed interest whether or not profit is made."},{"s":"Commerce","t":"ICT and E-commerce","d":1,"q":"E-commerce means","o":["selling goods by barter","advertising on billboards","trading on the stock exchange only","buying and selling goods and services over the internet"],"a":3,"why":"E-commerce is electronic trade over networks, especially the internet."},{"s":"Commerce","t":"Aids-to-trade: Tourism and Warehousing","d":2,"q":"A bonded warehouse is used to store","o":["goods for local farmers","imported goods on which customs duty has not yet been paid","only perishable goods","goods awaiting export licences"],"a":1,"why":"Goods remain in bond until duty is paid or they are re-exported."},{"s":"Commerce","t":"Business capital and profits","d":2,"q":"A trader's sales are N800,000, cost of goods sold N520,000 and expenses N150,000. His net profit is","o":["N150,000","N280,000","N130,000","N650,000"],"a":2,"why":"Gross profit = 800,000 - 520,000 = 280,000; net profit = 280,000 - 150,000 = N130,000."},{"s":"Principles of Accounts","t":"Double entry","d":1,"q":"Goods bought on credit from Mr Okon are recorded by","o":["debiting Sales and crediting Okon","debiting Okon and crediting Purchases","debiting Purchases and crediting Okon's account","debiting Cash and crediting Purchases"],"a":2,"why":"Purchases (an expense/asset of goods) are debited; Okon becomes a creditor so his account is credited."},{"s":"Principles of Accounts","t":"Double entry","d":2,"q":"The owner withdraws cash from the business for personal use. The entries are","o":["debit Capital, credit Drawings","debit Drawings, credit Cash","debit Cash, credit Drawings","debit Drawings, credit Capital"],"a":1,"why":"Drawings increase (debit) and cash decreases (credit)."},{"s":"Principles of Accounts","t":"Ledger and trial balance","d":1,"q":"Which of these appears on the credit side of a trial balance?","o":["Rent paid","Purchases","Capital","Machinery"],"a":2,"why":"Capital is a credit balance; assets and expenses are debit balances."},{"s":"Principles of Accounts","t":"Final accounts","d":2,"q":"Opening stock N4,000; purchases N30,000; closing stock N5,000; sales N45,000. The gross profit is","o":["N11,000","N15,000","N29,000","N16,000"],"a":3,"why":"Cost of goods sold = 4,000 + 30,000 - 5,000 = 29,000; gross profit = 45,000 - 29,000 = N16,000."},{"s":"Principles of Accounts","t":"Bank reconciliation","d":2,"q":"Cheques issued but not yet presented for payment make the bank statement balance","o":["higher than the cash book balance","a debit balance only","equal to the cash book balance","lower than the cash book balance"],"a":0,"why":"The cash book has already been credited, but the bank has not yet paid out, so the bank balance is higher."},{"s":"Principles of Accounts","t":"Control accounts","d":2,"q":"Debtors at the start N12,000; credit sales N80,000; cash received N70,000; returns inward N2,000. Closing debtors are","o":["N24,000","N8,000","N20,000","N16,000"],"a":2,"why":"12,000 + 80,000 - 70,000 - 2,000 = N20,000."},{"s":"Principles of Accounts","t":"Partnership accounts","d":1,"q":"A and B share profits and losses in the ratio 3:2. If the net profit is N90,000, B's share is","o":["N54,000","N45,000","N30,000","N36,000"],"a":3,"why":"B's share = 2/5 x 90,000 = N36,000."},{"s":"Principles of Accounts","t":"Depreciation","d":2,"q":"A machine costs N520,000, has a residual value of N40,000 and a useful life of 8 years. The annual straight-line depreciation is","o":["N70,000","N60,000","N55,000","N65,000"],"a":1,"why":"(520,000 - 40,000) / 8 = N60,000."},{"s":"Principles of Acco function journey(){const t=todayS(),st=S.started||t,ex=S.profile&&S.profile.examDate,end=(ex&&diffDays(st,ex)>=14)?ex:addDays(st,120),total=Math.max(14,diffDays(st,end)),el=Math.max(0,diffDays(st,t));return {total:total,el:el,frac:Math.min(1,el/total)}}
function rankInfo(){
 const r=rk(),j=journey();let t=0;
 for(let i=RANKS.length-1;i>=0;i--){if(r.xp>=RANKS[i][1]&&j.frac>=RANKS[i][2]){t=i;break}}
 const nx=RANKS[t+1]||null;let pct=100,why='';
 if(nx){
  const px=Math.max(0,Math.min(1,(r.xp-RANKS[t][1])/(nx[1]-RANKS[t][1]))),pt=Math.max(0,Math.min(1,(j.frac-RANKS[t][2])/(nx[2]-RANKS[t][2])));
  pct=Math.round(Math.min(px,pt)*100);
  const nxp=Math.max(0,nx[1]-r.xp),lock=Math.max(0,Math.ceil(nx[2]*j.total-j.el)),parts=[];
  if(nxp)parts.push(nxp+' XP');if(lock)parts.push(lock+' more day'+(lock>1?'s':''));
  why=parts.length?'Needs '+parts.join(' and ')+' for '+nx[0]:'Study today to reach '+nx[0];
 }

}
function xpAdd(n,quiet){
 const r=rk(),t=todayS();if(r.day!==t){r.day=t;r.today=0}
 const before=rankInfo().t;let g=n;
 if(n>0){g=Math.max(0,Math.min(n,XPCAP-r.today));r.today+=g;if(g<n&&!quiet&&once('xpcap'))toast('Daily XP limit reached. Come back tomorrow to keep climbing.')}

 if(!quiet){if(a.t>before)toast('Rank up: you are now '+a.name);else if(a.t<before)toast('Rank dropped to '+a.name+'. Study to win it back.')}
 return g;
}

 function expr(){let v=term();while(pk()==='+'||pk()==='-'||pk()==='−'){const o=nx(),w=term();v=o==='+'?v+w:v-w}return v}
 function term(){let v=unary();for(;;){const k=pk();if(k==='×'||k==='*'){nx();v*=unary()}else if(k==='÷'||k==='/'){nx();v/=unary()}else if(k==='mod'){nx();const w=unary();v=((v%w)+w)%w}else if(k!==undefined&&k!==')'&&k!==','&&!/^[+\-−×÷*\/^!%]$/.test(k)){v*=unary()}else break}return v}

/* ---------- own key: hide credit wording ---------- */
(function(){
 let busyFix=false;
 function fix(root){
  if(!ownKey()||busyFix)return;busyFix=true;
  try{
   const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const L=[];
   while((n=w.nextNode()))if(/credit/i.test(n.nodeValue))L.push(n);
   L.forEach(n=>{let t=n.nodeValue;
    t=t.replace(/\s*·\s*\d+ credits?\b/g,'').replace(/\b\d+ credits? · /g,'').replace(/\b\d+ credits? per question\.\s*/g,'');
    if(t!==n.nodeValue)n.nodeValue=t});
  }catch(e){}
  busyFix=false;
 }
 const go=()=>{fix(document.body);new MutationObserver(()=>fix(document.body)).observe(document.body,{childList:true,subtree:true,characterData:true})};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();

 try{
  const r=await fetch(remote()+'/api/auth/start',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},S.token?{Authorization:'Bearer '+S.token}:{}),body:JSON.stringify(LG.kind==='email'?{email:v}:{phone:v})});

 }catch(e){LG.err=e.message}
 loginView();
};

  if(!r.ok)throw new Error(j.error||'Could not confirm the code');
  S.token=j.token;setCr(j.credits);S.acct={email:j.email,phone:j.phone};
  if(j.name&&!ob.name)ob.name=j.name;

};

function subStash(x){
 const H=S.hold=S.hold||{},h=H[x]=H[x]||{};
 if(S.subj&&S.subj[x]){h.subj=S.subj[x];delete S.subj[x]}
 h.topic=h.topic||{};Object.keys(S.topic||{}).forEach(k=>{if(k.split('|')[0]===x){h.topic[k]=S.topic[k];delete S.topic[k]}});
 h.quiz=(h.quiz||[]).concat((S.quiz||[]).filter(q=>q.sub===x));S.quiz=(S.quiz||[]).filter(q=>q.sub!==x);
 h.mist=(h.mist||[]).concat((S.mist||[]).filter(m=>m.s===x));S.mist=(S.mist||[]).filter(m=>m.s!==x);
 if(S.ap){h.ap=(h.ap||[]).concat(S.ap.items.filter(t=>t.sub===x&&t.kind!=='exam'));S.ap.items=S.ap.items.filter(t=>!(t.sub===x&&t.kind!=='exam'))}
}
function subRestore(x){
 const h=(S.hold||{})[x];if(!h)return;
 if(h.subj)S.subj[x]=h.subj;Object.assign(S.topic,h.topic||{});
 S.quiz=(S.quiz||[]).concat(h.quiz||[]).sort((p,q)=>q.t-p.t).slice(0,30);S.mist=(S.mist||[]).concat(h.mist||[]);
 if(S.ap&&h.ap)S.ap.items=S.ap.items.concat(h.ap);
 delete S.hold[x];
}

const SUBALIAS={'accounting':'Principles of Accounts','accounts':'Principles of Accounts','account':'Principles of Accounts','maths':'Mathematics','math':'Mathematics','bio':'Biology','chem':'Chemistry','phy':'Physics','physic':'Physics','econs':'Economics','govt':'Government','lit':'Literature in English','literature':'Literature in English','crs':'Christian Religious Studies','crk':'Christian Religious Studies','irs':'Islamic Studies','irk':'Islamic Studies','agric':'Agricultural Science','further maths':'Further Mathematics','ict':'Computer Studies','computer':'Computer Studies','civic':'Civic Education'};
function wb(low,w){w=String(w).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('(^|[^a-z0-9])'+w+'(?![a-z0-9])').test(low)}
function subTopicIn(text){
 const low=String(text||'').toLowerCase(),mine=(S.profile&&S.profile.subjects)||[],all=Object.keys(SYL);
 const order=mine.filter(x=>all.indexOf(x)>=0).concat(all.filter(x=>mine.indexOf(x)<0));
 let sub=null;
 const names=order.slice().sort((x,y)=>y.length-x.length);
 sub=names.find(x=>wb(low,x))||null;
 if(!sub){const k=Object.keys(SUBALIAS).sort((x,y)=>y.length-x.length).find(x=>wb(low,x));if(k&&all.indexOf(SUBALIAS[k])>=0)sub=SUBALIAS[k]}
 let topic=null;
 const tp=(sb)=>(SYL[sb]||[]).slice().sort((x,y)=>y.length-x.length).find(n=>n.length>=5&&wb(low,n))||null;
 if(sub)topic=tp(sub);
 else for(const s2 of order){const t2=tp(s2);if(t2){sub=s2;topic=t2;break}}
 return sub?{sub:sub,topic:topic}:null;
}
function quizIntent(t){
 if(!/\b(quiz|test me|practi[cs]e|drill|questions? on)\b/i.test(t))return null;
 let f=subTopicIn(t);
 if(!f&&/\b(this|that|it|these|here|above)\b/i.test(t)||(!f&&/^\s*quiz me\W*$/i.test(t))){
  const rec=(S.chat||[]).slice(-6).reverse();
  for(const m of rec){if(m&&typeof m.x==='string'){f=subTopicIn(m.x);if(f)break}}
 }
 if(!f)return null;
 const qs=prepBank(8,f.sub,f.topic);if(!qs.length)return null;
 return {title:f.topic||f.sub,sub:f.sub,topic:f.topic,kind:f.topic?'topic':'mock',qs:qs};
}

 if((m=/\b([01]?\d|2[0-3]):([0-5]\d)\b/.exec(low))){const d=new Date();d.setHours(+m[1],+m[2],0,0);return d}
 if((m=/\bat (\d{1,2})\b/.exec(low))&&+m[1]>=1&&+m[1]<=12){let h=+m[1];if(h<7)h+=12;const d=new Date();d.setHours(h,0,0,0);return d}

 ks.forEach(k=>{o+='## '+k.title+'\n'+String(k.summary||'').slice(0,220)+'\n'+(k.concepts||[]).slice(0,5).join('; ')+'\n'+(k.notes||[]).slice(0,3).map(n=>(n.h?n.h+': ':'')+String(n.p||'').slice(0,200)).join('\n')+'\n'});

async function genExamQs(sub,topics,n,et){
 const style=et==='utme'?'JAMB UTME objective':et==='wassce'?'WASSCE objective':et==='neco'?'NECO objective':'Nigerian secondary school class test';
 const dg=et==='class'?notesDigest(sub):'';
 const key=sub+'|'+topics.join(',')+'|'+n+'|'+et+'|'+Math.floor(Date.now()/864e5)+'|'+(dg?dg.length:0);
 let j=peek('qgen',key),fresh=0;
 if(!j){
  if(!can(COST.exam))return [];
  const prompt='Write '+n+' multiple-choice questions for a '+style+' exam in '+sub+'. Topics (use these exact names in "t"): '+topics.join('; ')+'. Four options each, believable wrong options, exactly one correct, Nigerian or African examples where natural.'+(dg?' The student\'s own class notes follow. Base most questions on them and add a few from the standard curriculum for the same topics.\n'+dg:'')+'\nReturn JSON only: {"mcq":[{"q":"","o":["","","",""],"a":0,"why":"one short sentence","t":""}]}';
  const r=await ai(prompt,{kind:'qgen',json:true});j=pj(r.text);store('qgen',key,j);pay(COST.exam,'Exam questions: '+sub);fresh=1;
 }
 const out=[];
 (Array.isArray(j.mcq)?j.mcq:[]).forEach(q=>{const t=topics.indexOf(q&&q.t)>=0?q.t:topics[0];normQ([q],sub,t).forEach(x=>out.push(x))});
 let qs=out;
 if(fresh&&qs.length&&(ownKey()||S.vq)){try{qs=await verifyQs(qs,sub,topics[0])}catch(e){}}
 const g={};qs.forEach(q=>{(g[q.t]=g[q.t]||[]).push(q)});Object.keys(g).forEach(t=>{try{bankAdd(g[t],sub,t)}catch(e){}});
 qs.forEach(q=>q.id=qid(q.q));
 return qs;
}

 if(!subs.length)subs=(S.profile.subjects||[]).slice();
 const et=examType(),max=et==='utme'?4:6,n=et==='utme'?10:8;
 if(et==='utme'&&subs.indexOf('English')>=0)subs=['English'].concat(subs.filter(x=>x!=='English'));
 subs=subs.slice(0,max);
 const qs=[],miss=[];
 for(const sb of subs){
  const tops=[...new Set(win.filter(x=>x.sub===sb).map(x=>x.topic))],useT=tops.length?tops:(SYL[sb]||[]).slice(0,4);
  const got=[],has=q=>got.some(z=>z.q===q.q);
  if(et==='class'){
   const kq=[];(S.kits||[]).filter(k=>k.sub===sb).forEach(k=>(k.qs||[]).forEach(q=>kq.push(Object.assign({},q,{s:sb,t:q.t||k.title,src:'Your notes'}))));
   shuffle(kq).slice(0,Math.ceil(n/2)).forEach(q=>{if(!has(q))got.push(q)});
   if(!kq.length&&!(S.kits||[]).some(k=>k.sub===sb))miss.push(sb);
  }
  useT.forEach(tp=>prepBank(Math.ceil(n/useT.length)+1,sb,tp).forEach(q=>{if(!has(q)&&got.length<n+2)got.push(q)}));
  if(got.length<n){try{const g=await genExamQs(sb,useT,n-got.length+1,et);g.forEach(q=>{if(!has(q))got.push(Object.assign(q,{src:et==='class'?'Notes + research':'Exam style'}))})}catch(e){}}
  if(got.length<n)prepBank(n,sb).forEach(q=>{if(!has(q)&&got.length<n)got.push(q)});
  shuffle(got).slice(0,n).forEach(q=>qs.push(q));
 }
 return {qs:qs,subs:subs,miss:miss,et:et};
}

/* ---------- exam-setter prompt: how JAMB, WAEC and NECO build questions ---------- */
const SETTER={
 utme:'HOW JAMB (UTME) SETS QUESTIONS, copy this style:\n- Pure objective, four options A to D, exactly one correct. No "all of the above" or "none of the above" unless it truly fits.\n- Questions come from the official JAMB syllabus for the subject: each one tests one stated objective of one topic, never trivia outside it.\n- Mix of levels in every set: about 40% recall and understanding, about 40% application (use a formula, rule or idea on a new case), about 20% analysis (compare, interpret data or a diagram, decide what follows).\n- Short, direct stems. Under a minute per question. Calculations use clean numbers a student can do without a heavy calculator.\n- Distractors are the real mistakes students make (wrong sign, wrong unit, near-miss formula, confusing two terms), each plausible, similar in length.\n- Stems are self-contained. Where JAMB uses a passage, table or diagram, describe it fully in words inside the question.\n- Use of English: lexis and structure (best word, closest meaning, opposite), oral forms (stress, rhyme), comprehension, and sentence correction. Other subjects: pick the most examined areas first.\n- JAMB often re-tests the same idea in new words and numbers across years. Cover the high-yield ideas of the topic, then vary the wording and the figures.',
 wassce:'HOW WAEC (WASSCE) SETS QUESTIONS, copy this style:\n- Paper 1 is objective, four or five options, one correct. Paper 2 is theory and structured questions with parts (a), (b), (c) and marks shown, answered in sentences, workings or labelled drawings.\n- Questions follow the WAEC syllabus topic by topic and use command words: state, define, list, explain, describe, calculate, distinguish between, with reasons.\n- Marks reward method and clear steps, not just the final answer.\n- Practical and everyday West African contexts are common (markets, farming, local examples, Naira).\n- Objective items test understanding and application more than memory, with believable wrong options.',
 neco:'HOW NECO SETS QUESTIONS, copy this style:\n- Close to WAEC: Paper 1 objective, Paper 2 theory with parts and marks. Syllabus is the Nigerian senior secondary curriculum.\n- Command words (state, explain, calculate, differentiate) and plain Nigerian contexts.\n- Wrong options are believable and test common errors.',
 bece:'HOW BECE (Ghana junior school) SETS QUESTIONS, copy this style:\n- Objective items with four options plus structured questions, from the JHS syllabus only.\n- Simple clear language, everyday Ghanaian contexts, one idea per question.\n- Wrong options are believable and test common mistakes.',
 kcse:'HOW KCSE / KCPE (Kenya) SET QUESTIONS, copy this style:\n- Papers mix short-answer and structured questions with marks per part (KCSE) and multiple choice (KCPE), from the KNEC syllabus.\n- Command words: state, explain, calculate, describe, give reasons. Everyday Kenyan contexts.\n- Marks reward method and clear steps.',
 uni:'HOW A UNIVERSITY EXAM IS BUILT:\n- Questions follow a course outline: definitions and principles first, then application to a case or calculation, then analysis or discussion.\n- Mix of multiple choice (recall and application) and short essay or problem questions.\n- Use correct technical terms. Wrong options reflect real misconceptions.',
 postutme:'HOW POST-UTME SCREENING SETS QUESTIONS, copy this style:\n- Objective, four options, drawn from the senior secondary syllabus of the subjects for the course.\n- Faster and a little harder than UTME, with more application and reasoning than recall.\n- Believable wrong options built from real student mistakes.',
 class:'HOW A GOOD SCHOOL TEST IS BUILT:\n- Follows the scheme of work of that class and topic only.\n- Begin with easy recall, then understanding, then one or two harder application questions.\n- Clear, short stems and believable wrong options.'
};

function setterRules(et){return SETTER[setterKey(et)]||SETTER[et]||SETTER.class}

function subAcc(sub){const v=S.subj[sub];return v&&v.t>=5?(v.r+2)/(v.t+4):null}
function projTotal(){if(examType()!=='utme')return null;const r=projSubs().map(subAcc);return r.length&&r.every(x=>x!==null)?Math.round(r.reduce((a,x)=>a+x*100,0)):null}
function projCard(){
 const t=examType(),subs=projSubs();if(!subs.length)return '';

   body=gap<=0?'<div class="inset pad" style="margin-top:10px">You are above your target of '+tgt+'. Keep your streak and push higher.</div>':'<div class="inset pad" style="margin-top:10px">You need <b>+'+gap+'</b> points to reach '+tgt+'. Biggest chance: <b>'+esc(low.s)+'</b>'+(gain>0?', where reaching 70% adds about '+gain+' points':'')+'.</div>';

 }else{

function cbtPool(){return [...new Set(((S.profile&&S.profile.subjects)||[]).concat(S.custom||[]).concat(examType()==='utme'?['English']:[]))]}
function cbtRule(){
 const et=examType(),pool=cbtPool();
 if(et==='utme')return {min:4,max:4,must:['English'],note:'JAMB: 4 subjects. English is compulsory, pick 3 more.'};
 if(et==='class'){const n=Math.max(1,Math.min(S.classN||((S.profile.subjects||[]).length)||1,pool.length||1));return {min:n,max:n,must:[],note:'Your class exam: '+n+' subject'+(n>1?'s':'')+'.',classN:n}}
 const must=['English','Mathematics'].filter(x=>pool.indexOf(x)>=0);
 return {min:Math.min(7,pool.length),max:Math.min(9,pool.length),must:must,note:(et==='neco'?'NECO':'WAEC')+': 7 to 9 subjects. English and Mathematics are compulsory.'};
}

};

 });

 }else if(et==='class'){

async function genQ(sub,topic,count){

 const prompt=`Write ${count||8} multiple-choice questions and 1 theory question in the style of ${S.profile.exam} ${sub}, on the topic "${topic}".\n${setterRules()}\nUse Nigerian or African examples where natural. Make wrong options believable. Variation seed ${seed}.${dgFor(sub)}\nMethod: first write "facts": 6 to 8 short, verified facts, definitions, formulas or dates that standard ${S.profile.exam} textbooks and the syllabus teach for this topic (only things you are sure of). Then write every question ONLY from those facts, covering different sub-areas of the topic, from easy to exam level. The topic may be broad or only a few words: cover it as a teacher would.\nReturn JSON only: {"facts":[""],"mcq":[{"q":"","o":["","","",""],"a":0,"why":"one short sentence"}],"theory":[{"q":"","hint":"key points to include"}]}`;
 const key=sub+'|'+topic+'|'+(count||8);
 let j=peek('qgen',key),fresh=0;
 if(!j){
  if(!can(COST.qgen))return null;
  const r=await ai(prompt,{kind:'qgen',json:true});j=pj(r.text);store('qgen',key,j);pay(COST.qgen,'Practice questions: '+topic);fresh=1;
 }
 let qs=normQ(j.mcq,sub,topic);
 if(fresh&&qs.length&&(ownKey()||S.vq)){try{const v=await verifyQs(qs,sub,topic);if(v&&v.length)qs=v}catch(e){}}
 if(!qs.length)throw new Error('Eri could not write good questions this time. Try again.');
 const added=bankAdd(qs,sub,topic);if(added)toast(added+' new questions saved to your free bank');
 qs.forEach(q=>q.id=qid(q.q));

}

const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Could not read that file'));r.readAsDataURL(f)});
async function prepFile(f){
 if(f.type==='application/pdf'){
  if(f.size>1.9e6)throw new Error('That PDF is too big (limit 1.9 MB). Try fewer pages, or paste the text.');
  return {type:f.type,data:(await readURL(f)).split(',')[1],name:f.name};
 }
 if(/^image\//.test(f.type)){
  const u=await readURL(f);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Could not open that photo'));i.src=u});
  const sc=Math.min(1,(netSlow()?1000:1280)/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return {type:'image/jpeg',data:c.toDataURL('image/jpeg',netSlow()?.62:.72).split(',')[1],name:f.name||'photo'};
 }
 throw new Error('Choose a photo or a PDF.');
}

function rotPage(pg,deg){
 return new Promise(ok=>{const img=new Image();img.onload=()=>{
  const q=((deg%360)+360)%360,sw=q===90||q===270,W=img.width,H=img.height;
  const draw=(max,qq)=>{const sc=Math.min(1,max/Math.max(W,H)),w=Math.round((sw?H:W)*sc),h=Math.round((sw?W:H)*sc),c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(q*Math.PI/180);x.drawImage(img,-W*sc/2,-H*sc/2,W*sc,H*sc);return c.toDataURL('image/jpeg',qq).split(',')[1]};

/* ---------- solver brain: formula sheet, program-aided maths, independent recheck + arbitration ---------- */
const SOLVE_RULES='SOLVING RULES (follow strictly): 1) Copy the question data exactly; list every given value with units. 2) Name the law or formula first. 3) Substitute with units, one step at a time. 4) Put every calculation in "calc" so the app computes it exactly; never do arithmetic in your head. 5) Check the sign, units and size of the answer. FORMULA SHEET. Chemistry: moles n=m/M=V/22.4 (dm3 at s.t.p.)=cV; vapour density=M/2 so M=2xVD; Graham diffusion: rate is proportional to 1/sqrt(M), so (t_X/t_H)=(V_X/V_H)*sqrt(M_X/M_H) (time grows with volume and with sqrt of molar mass; a heavier gas is slower); Boyle P1V1=P2V2; Charles V1/T1=V2/T2 (kelvin); general P1V1/T1=P2V2/T2; percentage composition; Faraday Q=It, mass=(Q*M)/(96500*z). Physics: v=u+at, s=ut+0.5at^2, v^2=u^2+2as; F=ma; W=Fd; P=W/t; KE=0.5mv^2; PE=mgh; V=IR; P=IV; R series add, parallel 1/R=1/R1+1/R2; lens 1/f=1/u+1/v; n=sin i/sin r; v=f*lambda; g=10 m/s2 unless told. Maths: BODMAS; quadratic x=(-b+-sqrt(b^2-4ac))/2a; indices, logs (log(ab)=log a+log b); simple interest I=PRT/100, compound A=P(1+r/100)^n; AP a+(n-1)d, GP ar^(n-1); sin/cos/tan rules; sine rule, cosine rule; circle theorems; mean, median, mode, standard deviation; probability favourable/total; differentiation d/dx(x^n)=nx^(n-1). Always give the final answer with the correct unit and sensible significant figures. For theory subjects (Biology, Government, Literature, Economics, CRK, Commerce, Accounting) answer exactly what the question asks, in exam points, naming the key terms the marker looks for.';
const CALCSCHEMA='"calc":[{"n":"variable name","e":"expression using numbers and earlier names, with + - * / ^ and sqrt()"}],"ans":"name of the variable holding the final numeric answer, or empty","unit":"unit of the final answer, or empty"';
function runCalc(calc,ans){
 if(!Array.isArray(calc)||!calc.length)return null;
 const V={};let last=null;
 for(const it of calc.slice(0,25)){
  if(!it||!it.n||typeof it.e!=='string')return null;
  let bad=false;
  let e=it.e.replace(/\*\*/g,'^').replace(/\bpi\b/gi,'π').replace(/\bsqrt\s*\(/gi,'√(').replace(/[A-Za-z_][A-Za-z_0-9]*/g,w=>{
   if(V[w]!==undefined)return '('+V[w]+')';
   if(/^(ln|log|sin|cos|tan|abs|e)$/.test(w))return w;
   bad=true;return w});
  if(bad)return null;
  const v=mcalc(e);if(!isFinite(v))return null;
  V[it.n]=v;last=v;
 }
 const k=ans&&V[ans]!==undefined?V[ans]:last;
 return isFinite(k)?k:null;
}
function firstNum(s){const m=/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/i.exec(String(s||'').replace(/(\d),(?=\d{3})/g,'$1'));return m?parseFloat(m[0]):null}
const closeN=(a,b)=>isFinite(a)&&isFinite(b)&&Math.abs(a-b)<=1e-3*Math.max(1,Math.abs(a),Math.abs(b));
function jval(j){const c=runCalc(j.calc,j.ans);return c!==null?c:firstNum(j.answer)}
function lockAns(j){ // make the shown answer equal the code-computed value
 const c=runCalc(j.calc,j.ans);if(c===null)return j;
 const f=firstNum(j.answer);
 if(f===null||!closeN(c,f)){j.answer=mfmt(c)+(j.unit?' '+j.unit:'');j.fx=(j.fx||0)+1}
 return j;
}
const SJ='Return JSON only: {"question":"the full question exactly as printed, with every number and condition","given":"values and units, one line","approach":"law or method, one line","answer":"final answer with unit","steps":[{"t":"short step title","m":"working in simple words, LaTeX inside dollar signs"}],'+CALCSCHEMA+',"check":"one line verifying the answer by substitution or estimation","tip":"one short exam tip or common mistake"}';
async function dblCheck(j,pages,bg){
 try{
  if(!bg)busy(true,'Eri is double-checking the answer…');
  const q=String(j.qfull||j.question||'');
  const useImg=q.trim().length<25&&pages&&pages.length;
  if(!useImg&&q.trim().length<12){j.chk=3;return j}
  const head='You are a senior '+S.profile.exam+' examiner and teacher. '+SOLVE_RULES+'\n';
  const o={kind:'recheck',json:true,think:'medium'};if(useImg)o.imgs=pages.map(p=>({type:p.type,data:p.lg||p.data}));
  const r=await ai(head+'Solve this FROM SCRATCH, ignoring any other solution. '+(useImg?'The question is in the image.':'Question: '+q)+'\n'+SJ,o);
  const v=lockAns(pj(r.text)||{});
  const a=jval(j),b=jval(v);
  let agree=a!==null&&b!==null?closeN(a,b):(a===null&&b===null?String(j.answer).trim().toLowerCase()===String(v.answer).trim().toLowerCase():false);
  if(agree){j.chk=1;return lockAns(j)}

function mfmt(v){if(!isFinite(v))return 'undefined';const x=parseFloat(v.toPrecision(12));return Math.abs(x)>=1e12||(x!==0&&Math.abs(x)<1e-6)?x.toExponential(4).replace(/\.?0+e/,'e'):String(x)}

function mathLocal(t0){

 t=t.replace(/^(please\s+)?(what\s+is|what's|whats|calculate|compute|evaluate|work\s+out|find|solve|simplify)\s+/i,'').replace(/[?]+$/,'').trim();
 t=t.replace(/\bplus\b/gi,'+').replace(/\bminus\b/gi,'-').replace(/\b(times|multiplied by)\b/gi,'×').replace(/\bdivided by\b/gi,'÷').replace(/\bsquared\b/gi,'^2').replace(/\bcubed\b/gi,'^3').replace(/\b(square root of|sqrt of|sqrt)\s*/gi,'√').replace(/(\d)\s*[xX]\s*(?=[\d(])/g,'$1×');

 if((m=/^(\d+(?:\.\d+)?)\s*%\s*of\s*(\d+(?:\.\d+)?)$/i.exec(t))){const p=+m[1],n=+m[2],r=p/100*n;return '**'+mfmt(p)+'% of '+mfmt(n)+' = '+mfmt(r)+'**\n\n1. Change the percent to a fraction: '+mfmt(p)+'% = $\\frac{'+mfmt(p)+'}{100}$\n2. Multiply: $\\frac{'+mfmt(p)+'}{100}\\times '+mfmt(n)+' = '+mfmt(r)+'$\n\nChecked by the calculator, so this is exact.'}
 if(!/^[\d\s.+\-−×÷*\/^()%!√π=xX]+$/.test(t)||!/\d/.test(t))return null;
 if(t.indexOf('=')<0){
  if(/[xX]/.test(t))return null;
  if(!/[+\-−×÷*\/^%!√]/.test(t.replace(/^[-−]/,'')))return null;
  const v=mcalc(t);if(!isFinite(v))return null;
  const hasMix=/[+\-−]/.test(t.replace(/^[-−]/,''))&&/[×÷*\/^]/.test(t);
  return '**'+t.replace(/\*/g,'×').replace(/\//g,'÷')+' = '+mfmt(v)+'**\n\n'+(hasMix?'Follow BODMAS: brackets first, then powers, then × and ÷, then + and −.\n\n':'')+'Checked by the calculator, so this is exact.'}
 // equation in x
 const sides=t.split('=');if(sides.length!==2||!/[xX]/.test(t))return null;
 const f=x=>mcalc(sides[0].replace(/[xX]/g,'('+x+')'))-mcalc(sides[1].replace(/[xX]/g,'('+x+')'));
 const f0=f(0),f1=f(1),f2=f(2);if(![f0,f1,f2].every(isFinite))return null;

 if(Math.abs(a)<eps){
  if(Math.abs(b)<eps)return null;
  const r=-c/b;return '**x = '+mfmt(r)+'**\n\n1. Move everything to one side: $'+mfmt(b)+'x'+(c<0?' - ':' + ')+mfmt(Math.abs(c))+' = 0$\n2. $'+mfmt(b)+'x = '+mfmt(-c)+'$\n3. $x = \\frac{'+mfmt(-c)+'}{'+mfmt(b)+'} = '+mfmt(r)+'$\n\nChecked by substituting back, so this is exact.'}
 const D=b*b-4*a*c,sg=(v,first)=>(v<0?(first?'-':' - '):(first?'':' + '))+(Math.abs(v)===1&&false?'':mfmt(Math.abs(v)));
 let h='**Quadratic: $'+(a===1?'':a===-1?'-':mfmt(a))+'x^2'+(Math.abs(b)<eps?'':(b<0?' - ':' + ')+(Math.abs(b)===1?'':mfmt(Math.abs(b)))+'x')+(Math.abs(c)<eps?'':(c<0?' - ':' + ')+mfmt(Math.abs(c)))+' = 0$**\n\n1. $a='+mfmt(a)+',\\ b='+mfmt(b)+',\\ c='+mfmt(c)+'$\n2. Discriminant $D=b^2-4ac='+mfmt(D)+'$\n';
 if(D<-eps)return h+'3. $D<0$, so there are no real roots.\n\nChecked by the calculator.';
 const s=Math.sqrt(Math.max(0,D)),r1=(-b+s)/(2*a),r2=(-b-s)/(2*a);
 return h+'3. $x=\\frac{-b\\pm\\sqrt{D}}{2a}$\n4. '+(D<eps?'One repeated root: $x='+mfmt(r1)+'$':'$x='+mfmt(r1)+'$ or $x='+mfmt(r2)+'$')+'\n\nChecked by the calculator, so this is exact.';
}
/* scan AI text for "number-sum = result" lines and fix wrong results */
function fixArith(text){
 let n=0;const OP='[+\\-−×÷*\\/^]|\\\\times|\\\\div|\\\\cdot',NUM='\\(?-?\\d+(?:\\.\\d+)?\\)?';
 const re=new RegExp('(?<![\\w.^_{}\\\\])((?:'+NUM+'\\s*(?:'+OP+')\\s*)+'+NUM+')\\s*=\\s*(-?\\d+(?:\\.\\d+)?)(?!\\s*(?:'+OP+'|[\\d.]))','g');
 const out=String(text).replace(re,(all,l,r)=>{
  const src=l.replace(/\\times|\\cdot/g,'×').replace(/\\div/g,'÷');
  const v=mcalc(src);if(!isFinite(v))return all;
  const k=(r.split('.')[1]||'').length,tol=0.5*Math.pow(10,-k)+Math.abs(v)*1e-9;
  if(Math.abs(v-parseFloat(r))<=tol)return all;
  n++;return all.slice(0,all.length-r.length)+(k?v.toFixed(k):mfmt(v));
 });
 return {text:out,n};
}

function cleanTxt(t){return String(t==null?'':t).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/\s+/g,' ').trim()}
function parsePQ(j,sub,type){
 const arr=Array.isArray(j)?j:Array.isArray(j&&j.data)?j.data:(j&&j.data&&typeof j.data==='object')?[j.data]:Array.isArray(j&&j.questions)?j.questions:(j&&j.question)?[j]:[];
 const out=[];
 arr.forEach(r=>{
  if(!r||typeof r!=='object')return;
  if(r.image||r.hasPassage||/<img/i.test(String(r.question||'')))return;
  const q=cleanTxt(r.question||r.q||r.text);
  let o=r.option||r.options||r.choices;
  if(o&&!Array.isArray(o))o=['a','b','c','d','e'].map(k=>o[k]!=null?o[k]:o[k.toUpperCase()]).filter(x=>x!=null&&String(x).trim()!=='');
  if(!q||!Array.isArray(o))return;
  o=o.map(cleanTxt);
  if(o.length<2||o.length>4||/<img/i.test(JSON.stringify(r.option||r.options||'')))return;
  let a=r.answer!=null?r.answer:r.correct;
  let ai=-1;
  if(typeof a==='number')ai=(a>=0&&a<o.length)?a:(a>=1&&a<=o.length?a-1:-1);
  else{a=cleanTxt(a);if(/^[a-e]$/i.test(a))ai=a.toLowerCase().charCodeAt(0)-97;else ai=o.findIndex(x=>x.toLowerCase()===a.toLowerCase())}
  if(ai<0||ai>=o.length)return;
  out.push({s:sub,t:cleanTxt(r.section||r.topic)||'Past questions',d:2,q:q,o:o,a:ai,why:cleanTxt(r.solution||r.explanation||'').slice(0,500),src:(String(r.examtype||type).toUpperCase()+' '+(r.examyear||r.year||'')).trim()});
 });
 return out;
}

 if(e&&e.status===429)return 'Past-questions limit reached for now. Try again later, or practise your saved ones.';
 return (e&&e.message)||'Could not get past questions';
}

const EASE='cubic-bezier(0.22,1,0.36,1)';

 const st=performance.now()+(delay||0);el.textContent='0'+sfx;
 (function f(now){const t=Math.min(1,Math.max(0,(now-st)/dur));el.textContent=Math.round(to*easeOut(t))+sfx;if(t<1)requestAnimationFrame(f)})(performance.now());

function reveal(el,run,now){
 if(now||!('IntersectionObserver' in window)){run();return}

  io.observe(el);
 };
 go();
}
const ANSEL='.bar i,.vb,svg[aria-label$="percent"],svg[aria-label^="Brain speed over"],[data-cnt]';

  if(Q&&!Q.fin&&page&&page.t==='quiz')return;
  if(!(root.matches&&root.matches(ANSEL))&&!root.querySelector(ANSEL))return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const all=sel=>[].concat(root.matches&&root.matches(sel)?[root]:[],[].slice.call(root.querySelectorAll(sel)));
  const dl=i=>Math.min(i,8)*90,groups=new Map();
  const add=(el,fn)=>{const g=el.closest('.raise')||root;if(!groups.has(g))groups.set(g,[]);groups.get(g).push(fn)};
  all('.bar i').forEach(el=>{const w=el.style.width;if(!w)return;el.style.width='0%';add(el,i=>{el.style.width=w;el.animate([{width:'0%'},{width:w}],{duration:1500,delay:dl(i),easing:EASE,fill:'backwards'})})});
  all('.vb').forEach(el=>{const h=el.style.height;if(!h)return;el.style.height='0%';add(el,i=>{el.style.height=h;el.animate([{height:'0%'},{height:h}],{duration:1500,delay:dl(i),easing:EASE,fill:'backwards'})})});
  all('svg[aria-label$="percent"]').forEach(svg=>{

   const da=c?(c.getAttribute('stroke-dasharray')||'').split(' '):[],v=tx?parseInt(tx.textContent,10):NaN;

   add(svg,()=>{
    if(c&&da.length===2){c.setAttribute('stroke-dasharray',da.join(' '));c.animate([{strokeDasharray:'0 '+da[1]},{strokeDasharray:da[0]+' '+da[1]}],{duration:1900,easing:EASE,fill:'backwards'})}
    if(tx&&!isNaN(v))countUp(tx,v,900,'%',0);
   });
  });
  all('svg[aria-label^="Brain speed over"]').forEach(svg=>{
   const pa=svg.querySelector('path'),dots=[].slice.call(svg.querySelectorAll('circle,text'));
   let L=0;try{L=pa.getTotalLength()}catch(e){}

   dots.forEach(n=>{n.style.opacity='0'});
   add(svg,()=>{
    if(pa&&L){pa.style.strokeDashoffset='0';pa.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:1900,easing:EASE,fill:'backwards'})}
    dots.forEach(n=>{n.style.opacity='';n.animate([{opacity:0},{opacity:1}],{duration:700,delay:1100,easing:'ease-out',fill:'backwards'})});

  groups.forEach((fns,g)=>{const rpe=g.closest?g.closest('.rp'):null,wt=rpe?(+rpe.dataset.d||0)+250:0;reveal(g,()=>{const go=()=>fns.forEach((fn,i)=>fn(i));wt?setTimeout(go,wt):go()},now)});
 }catch(e){}
}

(function(){

 const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

  for(let el=t;el&&el!==document.body;el=el.parentElement){if(el.scrollWidth>el.clientWidth+4&&/(auto|scroll)/.test(getComputedStyle(el).overflowX))return}

 },{passive:true});

 },{passive:true});

  if(!ok)return;ok=false;

  const i=ids.indexOf(tab),n=i+(dx<0?1:-1);
  if(!go||n<0||n>=ids.length||RM()){settle();if(go&&n>=0&&n<ids.length)A.go(ids[n]);return}
  const dir=dx<0?-1:1,v=vw;

    setTimeout(()=>{nv.style.transition='';nv.style.willChange=''},560);
   }));
  },190);
 },{passive:true});
 document.addEventListener('touchcancel',()=>{if(drag){drag=false;ok=false;settle()}},{passive:true});
})();

  S.hon.sched[todayS()]=tasksToday().length;
  save();
 }
